name: Deploy static workspace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Do not let a late older push event cancel a newer deployment.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # Artifact indexing can briefly lag behind upload. Keep deployment in a
  # separate dependent job, so retrying only a failed deployment cannot
  # generate a second github-pages artifact in the same workflow run.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub may deliver older push events after newer ones. Do not
      # overwrite the site with a stale commit even if the run is queued.
      - name: Check main revision before publishing
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale Pages run: $GITHUB_SHA (current: $latest)"
          fi
      - name: Deploy
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
