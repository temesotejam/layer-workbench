name: Audit WebAssembly patches against stable source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-wasm-patches.yml"
      - ".github/workflows/build-wasm-candidate.yml"
      - "upstream/stable.json"
      - "docs/WEB_PORT_SOURCE_AUDIT.md"
      - "scripts/adapt-orcawasm-v2.5.0.py"
      - "scripts/patch-orcawasm-3mf-object-export.py"
      - "scripts/test_patch_orcawasm_3mf_object_export.py"
      - "scripts/build-assimp-wasm.sh"
      - "scripts/build-draco-wasm.sh"
      - "scripts/prepare-wasm-runner.sh"
  workflow_dispatch:
    inputs:
      orca_version:
        description: "Stable upstream tag to audit"
        required: true
        default: "v2.5.0"

permissions:
  contents: read

jobs:
  patch-audit:
    # Keep the CI image stable while validating the fixed v2.5.0 port.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate runner tool bootstrap (no APT dependency)
        run: |
          set -euo pipefail
          bash -n scripts/prepare-wasm-runner.sh
          bash scripts/prepare-wasm-runner.sh

      - name: Resolve target version
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${{ inputs.orca_version }}"
          else
            version="$(jq -r '.latest_stable_seen' upstream/stable.json)"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable semantic version tag, got: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch WebAssembly port and target upstream source
        env:
          ORCA_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          git clone https://github.com/Hiosdra/OrcaWasm.git orcawasm
          git -C orcawasm checkout 60a09e04f1990be39c8f6f35dffef1a2c9e224c4
          git clone --depth 1 --branch "$ORCA_VERSION" \
            https://github.com/OrcaSlicer/OrcaSlicer.git orcawasm/orca
          {
            echo "## Patch audit target"
            echo "- WebAssembly port commit: $(git -C orcawasm rev-parse HEAD)"
            echo "- Upstream source tag: $ORCA_VERSION"
            echo "- Upstream source commit: $(git -C orcawasm/orca rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Adapt known compatibility patch anchors for v2.5.0
        run: python3 scripts/adapt-orcawasm-v2.5.0.py orcawasm/patches/apply.py orcawasm/orca/CMakeLists.txt orcawasm/scripts/build-local-wsl.sh

      - name: Unit-test experimental 3MF native export patch
        run: python3 -m unittest discover -s scripts -p 'test_patch_orcawasm_3mf_object_export.py' -v

      - name: Apply staged hierarchy-preserving native 3MF export patch (audit only)
        run: python3 scripts/patch-orcawasm-3mf-object-export.py orcawasm/bridge/slicer.cpp

      - name: Audit native 3MF export branch without building or publishing
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'This is an experimental candidate, NOT desktop 3MF parity.' orcawasm/bridge/slicer.cpp
          python3 - <<'PY'
          from pathlib import Path
          text = Path('orcawasm/bridge/slicer.cpp').read_text()
          start = text.index('oneslicer_status_t oneslicer_project_export(')
          end = text.index('oneslicer_status_t oneslicer_project_get_asset(', start) if 'oneslicer_status_t oneslicer_project_get_asset(' in text[start:] else -1
          fragment = text[start:] if end < 0 else text[start:end]
          if 'write_single_mesh_3mf(' in fragment:
              raise SystemExit('The portable 3MF export still flattens objects')
          if fragment.count('write_project_model_3mf(') < 2:
              raise SystemExit('Expected both modifier and ordinary native project exports')
          PY

      - name: Verify v2.5.0 dependency compatibility settings
        run: |
          set -euo pipefail
          grep -Fxq 'CGAL_VERSION=6.2.1' orcawasm/scripts/build-local-wsl.sh
          grep -Fq '.math_built_mt_native_eh_v2_cgal_6_2_1' orcawasm/scripts/build-local-wsl.sh
          grep -Fq -- '-DSLIC3R_CAD=OFF' orcawasm/scripts/build-local-wsl.sh
          # v2.5.0 native Linux packaging copies FFmpeg .so files absent from WASM.
          # Guard the staging call without altering upstream desktop behavior.
          grep -Fq 'if (NOT APPLE AND NOT SLIC3R_WASM)' orcawasm/orca/src/CMakeLists.txt

      - name: Verify wasm32-safe Arachne bead-count saturation
        run: |
          set -euo pipefail
          grep -Fq 'inset_count > std::numeric_limits<size_t>::max() / 2' orcawasm/orca/src/libslic3r/Arachne/WallToolPaths.cpp
          grep -Fq '? std::numeric_limits<size_t>::max()' orcawasm/orca/src/libslic3r/Arachne/WallToolPaths.cpp

      - name: Verify WASM-only OpenCV texture-source exclusion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cmake = Path("orcawasm/orca/src/libslic3r/CMakeLists.txt").read_text(encoding="utf-8")
          guard = (
              "if(SLIC3R_WASM)\n"
              "    list(REMOVE_ITEM lisbslic3r_sources\n"
              "        TexturePainting.cpp\n"
              "        TextureToColor/TextureToColor.cpp\n"
              "    )\n"
              "endif()"
          )
          if cmake.count(guard) != 1:
              raise SystemExit("WASM-only OpenCV texture guard missing or duplicated")
          PY

      - name: Verify WASM uses exact Voronoi predicates, not unsupported rounding filters
        shell: bash
        run: |
          set -euo pipefail
          file=orcawasm/orca/src/libslic3r/Geometry/VoronoiUtilsCgal.cpp
          grep -Fq 'using ParabolicTangentToSegmentOrientationPredicateFiltered = ExactWasmPredicate<' "$file"
          grep -Fq 'using ParabolicTangentToParabolicTangentOrientationPredicateFiltered = ExactWasmPredicate<' "$file"
          grep -Fq '#if defined(SLIC3R_WASM) && defined(ARACHNE_DEBUG)' "$file"
          grep -Fq '#include <CGAL/Surface_sweep_2_algorithms.h>' "$file"
          grep -Fq '#if !defined(SLIC3R_WASM)' "$file"

      - name: Verify v2.5.0 capability metadata matches pinned upstream
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bridge = Path("orcawasm/bridge/slicer.cpp").read_text(encoding="utf-8")
          expected = '"engine":{"family":"OrcaSlicer","version":"2.5.0"}'
          if bridge.count(expected) != 1:
              raise SystemExit("WASM engine does not advertise source tag v2.5.0")
          if '"engine":{"family":"OrcaSlicer","version":"2.4.2"}' in bridge:
              raise SystemExit("WASM engine still reports old v2.4.2 metadata")
          PY

      - name: Verify OrcaSlicer v2.5 bridge validation API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bridge = Path("orcawasm/bridge/slicer.cpp").read_text(encoding="utf-8")
          expected = "Slic3r::StringObjectException validation_error = print.validate();"
          if bridge.count(expected) != 1 or "print.validate(&warning)" in bridge:
              raise SystemExit("v2.5.0 Print::validate bridge adaptation missing")
          PY

      - name: Validate pinned Assimp WASM dependency recipe
        run: |
          set -euo pipefail
          bash -n scripts/build-assimp-wasm.sh
          grep -Fq 'VERSION="5.4.3"' scripts/build-assimp-wasm.sh
          grep -Fq '66dfbaee288f2bc43172440a55d0235dfc7bf885dda6435c038e8000e79582cb' scripts/build-assimp-wasm.sh
          grep -Fq -- '-DBUILD_SHARED_LIBS=OFF' scripts/build-assimp-wasm.sh
          grep -Fq -- '-DASSIMP_BUILD_GLTF_IMPORTER=ON' scripts/build-assimp-wasm.sh
          grep -Fq -- '-DASSIMP_BUILD_OBJ_IMPORTER=ON' scripts/build-assimp-wasm.sh
          grep -Fq -- '-DASSIMP_BUILD_FBX_IMPORTER=ON' scripts/build-assimp-wasm.sh

      - name: Validate pinned Draco WASM dependency recipe
        run: |
          set -euo pipefail
          bash -n scripts/build-draco-wasm.sh
          grep -Fq 'VERSION="1.5.7"' scripts/build-draco-wasm.sh
          grep -Fq '27b72ba2d5ff3d0a9814ad40d4cb88f8dc89a35491c0866d952473f8f9416b77' scripts/build-draco-wasm.sh
          grep -Fq -- '-DDRACO_JS_GLUE=OFF' scripts/build-draco-wasm.sh
          grep -Fq -- '-DBUILD_SHARED_LIBS=OFF' scripts/build-draco-wasm.sh
          grep -Fq -- '-DDRACO_INSTALL=ON' scripts/build-draco-wasm.sh
          # Draco's legacy CMake requires the EMSCRIPTEN directory variable.
          grep -Fq 'export EMSCRIPTEN="${EMSDK}/upstream/emscripten"' scripts/build-draco-wasm.sh
          grep -Fq 'draco::draco' scripts/build-draco-wasm.sh

      - name: Apply compatibility patches in the disposable audit checkout
        working-directory: orcawasm
        run: |
          set -o pipefail
          python3 patches/apply.py 2>&1 | tee "$GITHUB_WORKSPACE/patch-audit.log"

      - name: Verify retired TextShape override is absent after patching
        shell: bash
        run: |
          set -euo pipefail
          test ! -e orcawasm/orca/src/libslic3r/Shape/TextShape.cpp
          test ! -e orcawasm/orca/src/libslic3r/Shape/TextShape.hpp
          if grep -Fq 'Shape/TextShape.cpp' orcawasm/patches/apply.py ||
             grep -Fq 'Shape/TextShape.cpp' orcawasm/orca/src/libslic3r/CMakeLists.txt; then
            echo "::error::Retired TextShape override leaked into v2.5.0 build sources"
            exit 1
          fi

      - name: Verify Boost.Log uses the pthread ABI end-to-end
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'STAMP="${INSTALL}/.boost_built_mt_native_eh_v4"' orcawasm/scripts/build-local-wsl.sh
          if grep -Fq 'define=BOOST_LOG_NO_THREADS=1' orcawasm/scripts/build-local-wsl.sh; then
            echo "::error::Boost.Log library is still built with its single-thread ABI"
            exit 1
          fi
          if grep -Fq 'BOOST_LOG_NO_THREADS' orcawasm/cmake/wasm_find_paths.cmake; then
            echo "::error::Boost.Log consumers still request the single-thread ABI"
            exit 1
          fi
          grep -Fq 'asynchronous_sink<boost::log::sinks::text_ostream_backend>' orcawasm/orca/src/libslic3r/utils.cpp
          grep -Fq 'synchronous_sink<boost::log::sinks::text_file_backend>' orcawasm/orca/src/libslic3r/utils.cpp
          if grep -Fq 'unlocked_sink<boost::log::sinks::text_file_backend>' orcawasm/orca/src/libslic3r/utils.cpp; then
            echo "::error::Unsafe unlocked Boost.Log sink patch still applied"
            exit 1
          fi

      - name: Fail if a required patch anchor no longer matches
        if: always()
        run: |
          set -euo pipefail
          if grep -E "WARN pattern not found|FATAL:" patch-audit.log; then
            echo "::error::One or more compatibility patch anchors did not match the selected upstream source."
            exit 1
          fi

      - name: Upload patch audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-audit-${{ steps.target.outputs.version }}
          path: patch-audit.log
          if-no-files-found: ignore
          retention-days: 30
