name: Audit WebAssembly patches against stable source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-wasm-patches.yml"
      - "upstream/stable.json"
      - "docs/WEB_PORT_SOURCE_AUDIT.md"
      - "scripts/adapt-orcawasm-v2.5.0.py"
      - "scripts/build-assimp-wasm.sh"
      - "scripts/build-draco-wasm.sh"
  workflow_dispatch:
    inputs:
      orca_version:
        description: "Stable upstream tag to audit"
        required: true
        default: "v2.5.0"

permissions:
  contents: read

jobs:
  patch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve target version
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${{ inputs.orca_version }}"
          else
            version="$(jq -r '.latest_stable_seen' upstream/stable.json)"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable semantic version tag, got: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch WebAssembly port and target upstream source
        env:
          ORCA_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          git clone https://github.com/Hiosdra/OrcaWasm.git orcawasm
          git -C orcawasm checkout 60a09e04f1990be39c8f6f35dffef1a2c9e224c4
          git clone --depth 1 --branch "$ORCA_VERSION" \
            https://github.com/OrcaSlicer/OrcaSlicer.git orcawasm/orca
          {
            echo "## Patch audit target"
            echo "- WebAssembly port commit: $(git -C orcawasm rev-parse HEAD)"
            echo "- Upstream source tag: $ORCA_VERSION"
            echo "- Upstream source commit: $(git -C orcawasm/orca rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Adapt known compatibility patch anchors for v2.5.0
        run: python3 scripts/adapt-orcawasm-v2.5.0.py orcawasm/patches/apply.py orcawasm/orca/CMakeLists.txt orcawasm/scripts/build-local-wsl.sh

      - name: Verify v2.5.0 dependency compatibility settings
        run: |
          set -euo pipefail
          grep -Fxq 'CGAL_VERSION=6.2.1' orcawasm/scripts/build-local-wsl.sh
          grep -Fq '.math_built_mt_native_eh_v2_cgal_6_2_1' orcawasm/scripts/build-local-wsl.sh
          grep -Fq -- '-DSLIC3R_CAD=OFF' orcawasm/scripts/build-local-wsl.sh

      - name: Validate pinned Assimp WASM dependency recipe
        run: |
          set -euo pipefail
          bash -n scripts/build-assimp-wasm.sh
          grep -Fq 'VERSION="5.4.3"' scripts/build-assimp-wasm.sh
          grep -Fq '66dfbaee288f2bc43172440a55d0235dfc7bf885dda6435c038e8000e79582cb' scripts/build-assimp-wasm.sh
          grep -Fq -- '-DBUILD_SHARED_LIBS=OFF' scripts/build-assimp-wasm.sh
          grep -Fq -- '-DASSIMP_BUILD_GLTF_IMPORTER=ON' scripts/build-assimp-wasm.sh
          grep -Fq -- '-DASSIMP_BUILD_OBJ_IMPORTER=ON' scripts/build-assimp-wasm.sh
          grep -Fq -- '-DASSIMP_BUILD_FBX_IMPORTER=ON' scripts/build-assimp-wasm.sh

      - name: Validate pinned Draco WASM dependency recipe
        run: |
          set -euo pipefail
          bash -n scripts/build-draco-wasm.sh
          grep -Fq 'VERSION="1.5.7"' scripts/build-draco-wasm.sh
          grep -Fq '27b72ba2d5ff3d0a9814ad40d4cb88f8dc89a35491c0866d952473f8f9416b77' scripts/build-draco-wasm.sh
          grep -Fq -- '-DDRACO_JS_GLUE=OFF' scripts/build-draco-wasm.sh
          grep -Fq -- '-DBUILD_SHARED_LIBS=OFF' scripts/build-draco-wasm.sh
          grep -Fq -- '-DDRACO_INSTALL=ON' scripts/build-draco-wasm.sh
          grep -Fq 'draco::draco' scripts/build-draco-wasm.sh

      - name: Apply compatibility patches in the disposable audit checkout
        working-directory: orcawasm
        run: |
          set -o pipefail
          python3 patches/apply.py 2>&1 | tee "$GITHUB_WORKSPACE/patch-audit.log"

      - name: Fail if a required patch anchor no longer matches
        if: always()
        run: |
          set -euo pipefail
          if grep -E "WARN pattern not found|FATAL:" patch-audit.log; then
            echo "::error::One or more compatibility patch anchors did not match the selected upstream source."
            exit 1
          fi

      - name: Upload patch audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-audit-${{ steps.target.outputs.version }}
          path: patch-audit.log
          if-no-files-found: ignore
          retention-days: 30
