name: Audit WebAssembly patches against stable source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-wasm-patches.yml"
      - "upstream/stable.json"
      - "docs/WEB_PORT_SOURCE_AUDIT.md"
  workflow_dispatch:
    inputs:
      orca_version:
        description: "Stable upstream tag to audit"
        required: true
        default: "v2.5.0"

permissions:
  contents: read

jobs:
  patch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve target version
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${{ inputs.orca_version }}"
          else
            version="$(jq -r '.latest_stable_seen' upstream/stable.json)"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable semantic version tag, got: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch WebAssembly port and target upstream source
        env:
          ORCA_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Hiosdra/OrcaWasm.git orcawasm
          git clone --depth 1 --branch "$ORCA_VERSION" \
            https://github.com/OrcaSlicer/OrcaSlicer.git orcawasm/orca
          {
            echo "## Patch audit target"
            echo "- WebAssembly port commit: $(git -C orcawasm rev-parse HEAD)"
            echo "- Upstream source tag: $ORCA_VERSION"
            echo "- Upstream source commit: $(git -C orcawasm/orca rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Adapt known compatibility patch anchors for v2.5.0
        env:
          ORCA_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$ORCA_VERSION" != "v2.5.0" ]]; then
            echo "No version-specific patcher adapter is defined for $ORCA_VERSION."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path("orcawasm/patches/apply.py")
          source = path.read_text(encoding="utf-8")

          old_fields = r"""r'float   min_bead_width;\n    float   min_feature_size;\n    float   min_length_factor;\n    float   wall_transition_length;\n    float   wall_transition_angle;\n    float   wall_transition_filter_deviation;\n    int     wall_distribution_count;\n    bool    is_top_or_bottom_layer;',"""
          new_fields = r"""r'float\s+min_bead_width\s*=\s*0\.f;\s*\n\s*float\s+min_feature_size\s*=\s*0\.f;\s*\n\s*float\s+min_length_factor\s*=\s*0\.5f;\s*\n\s*float\s+wall_transition_length\s*=\s*0\.f;\s*\n\s*float\s+wall_transition_angle\s*=\s*10\.f;\s*\n\s*float\s+wall_transition_filter_deviation\s*=\s*0\.f;\s*\n\s*int\s+wall_distribution_count\s*=\s*1;\s*\n\s*bool\s+is_top_or_bottom_layer\s*=\s*false;',"""
          if old_fields not in source:
              raise SystemExit("Could not find the expected v2.4.2 WallToolPathsParams patch anchor in OrcaWasm patcher.")
          source = source.replace(old_fields, new_fields, 1)

          old_thread = r"   \\tpthread_setname_np\\(thread\\.native_handle\\(\\), thread_name\\);"
          new_thread = r"\\s*pthread_setname_np\\(thread\\.native_handle\\(\\), thread_name\\);"
          if old_thread not in source:
              raise SystemExit("Could not find the expected v2.4.2 pthread patch anchor in OrcaWasm patcher.")
          source = source.replace(old_thread, new_thread, 1)

          path.write_text(source, encoding="utf-8")
          print("Adapted WallToolPathsParams and Thread.cpp patch anchors for v2.5.0.")
          PY

      - name: Dry-run existing compatibility patch set
        working-directory: orcawasm
        run: |
          set -o pipefail
          python3 patches/apply.py --check 2>&1 | tee "$GITHUB_WORKSPACE/patch-audit.log"

      - name: Fail if a required patch anchor no longer matches
        if: always()
        run: |
          set -euo pipefail
          if grep -E "WARN pattern not found|FATAL:" patch-audit.log; then
            echo "::error::One or more compatibility patch anchors did not match the selected upstream source."
            exit 1
          fi

      - name: Upload patch audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-audit-${{ steps.target.outputs.version }}
          path: patch-audit.log
          if-no-files-found: ignore
          retention-days: 30
