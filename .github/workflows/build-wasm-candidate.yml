name: Build v2.5.0 WebAssembly candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-wasm-candidate.yml"
      - "scripts/patch-orcawasm-3mf-object-export.py"
      - "scripts/patch_orcawasm_preservation_guard.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-v2.5.0-candidate
  cancel-in-progress: false

jobs:
  build:
    # Stable runner image: ubuntu-latest moved to 26.04 and its apt mirrors
    # failed DNS resolution in #43047097790 before any WASM work began.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      # GitHub-hosted Ubuntu 24.04 already ships the build toolchain.
      # Avoid apt-get: Azure Ubuntu mirror DNS failed repeatedly even with
      # 3 retries (run #43051471275), before CMake could start.
      - name: Verify preinstalled build tools (APT-free)
        shell: bash
        run: bash scripts/prepare-wasm-runner.sh

      - name: Clone and pin the WebAssembly engine source
        run: |
          git clone https://github.com/Hiosdra/OrcaWasm.git orcawasm
          git -C orcawasm checkout 60a09e04f1990be39c8f6f35dffef1a2c9e224c4

      - name: Clone target OrcaSlicer source
        run: git clone --depth 1 --branch v2.5.0 https://github.com/OrcaSlicer/OrcaSlicer.git orcawasm/orca

      - name: Cache Emscripten SDK
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: /opt/emsdk
          key: emsdk-ubuntu-mt-3.1.74-native-eh-v1

      - name: Install Emscripten
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          /opt/emsdk/emsdk install 3.1.74
          /opt/emsdk/emsdk activate 3.1.74

      - name: Restore dependency and compiler caches
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            orcawasm/deps-install
            orcawasm/build-wasm/emscripten-cache-mt
            ~/.cache/ccache
          key: wasm-v2.5.0-emsdk-3.1.74-cgal-6.2.1-assimp-5.4.3-draco-1.5.7-occt-7.8.1-onetbb-2021.13.2-native-eh-v5-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            wasm-v2.5.0-emsdk-3.1.74-cgal-6.2.1-assimp-5.4.3-draco-1.5.7-occt-7.8.1-onetbb-2021.13.2-native-eh-v5-${{ runner.os }}-
            wasm-v2.5.0-emsdk-3.1.74-cgal-6.2.1-assimp-5.4.3-draco-1.5.7-occt-7.8.1-onetbb-2021.13.2-native-eh-v4-${{ runner.os }}-
            wasm-v2.5.0-emsdk-3.1.74-cgal-6.2.1-assimp-5.4.3-occt-7.8.1-onetbb-2021.13.2-native-eh-v3-${{ runner.os }}-

      - name: Adapt the engine patcher to v2.5.0
        run: python3 scripts/adapt-orcawasm-v2.5.0.py orcawasm/patches/apply.py orcawasm/orca/CMakeLists.txt orcawasm/scripts/build-local-wsl.sh

      # Upstream build-local-wsl.sh runs the smoke suite in its trailing block.
      # Run the SAME smoke suite once as a dedicated CI gate after compilation.
      # A failure must still fail the build, but must not conceal the independent
      # native 3MF export regression or prevent useful runtime diagnostics.
      - name: Separate upstream embedded smoke from compilation (fail closed)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("orcawasm/scripts/build-local-wsl.sh")
          source = path.read_text(encoding="utf-8")
          suffix = "(\nnode scripts/smoke-test.mjs --wasm-dir artifacts\n)\n"
          if not source.endswith(suffix) or source.count(suffix) != 1:
              raise SystemExit("pinned OrcaWasm embedded smoke trailer drifted; refuse to modify")
          path.write_text(
              source[:-len(suffix)] + "# Smoke runs once in explicit CI gate below.\n",
              encoding="utf-8",
          )
          PY

      # The pinned generic-PLA modifier smoke previously relied on Orca's
      # implicit support_enable default. Select it explicitly for this test
      # fixture; DO NOT remove the baseline-vs-enforcer output assertion.
      - name: Unit-test fail-closed support smoke fixture patch
        run: python3 -m unittest discover -s scripts -p 'test_patch_orcawasm_support_smoke.py' -v

      - name: Enable supports explicitly in pinned generic modifier smoke fixture
        run: python3 scripts/patch-orcawasm-support-smoke.py orcawasm/scripts/smoke-test.mjs

      - name: Check fail-closed native 3MF export patch
        run: python3 -m unittest discover -s scripts -p 'test_patch_orcawasm_3mf_object_export.py' -v

      - name: Stage experimental native 3MF object-preserving exporter
        run: python3 scripts/patch-orcawasm-3mf-object-export.py orcawasm/bridge/slicer.cpp

      - name: Unit-test fail-closed imported 3MF preservation guard
        run: python3 -m unittest discover -s scripts -p 'test_patch_orcawasm_preservation_guard.py' -v

      - name: Stage imported native 3MF provenance guard
        run: python3 scripts/patch_orcawasm_preservation_guard.py orcawasm/bridge/slicer.cpp

      - name: Verify native 3MF export path no longer flattens all objects
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'This is an experimental candidate, NOT desktop 3MF parity.' orcawasm/bridge/slicer.cpp

      - name: Verify v2.5.0 omits the obsolete TextShape WASM override
        shell: bash
        run: |
          set -euo pipefail
          test ! -e orcawasm/orca/src/libslic3r/Shape/TextShape.cpp
          test ! -e orcawasm/orca/src/libslic3r/Shape/TextShape.hpp
          if grep -Fq 'Shape/TextShape.cpp' orcawasm/patches/apply.py; then
            echo "::error::Obsolete TextShape override still injected into v2.5.0"
            exit 1
          fi

      - name: Verify headless CMake excludes native FFmpeg packaging
        run: |
          set -euo pipefail
          grep -Fq 'if (NOT APPLE AND NOT SLIC3R_WASM)' orcawasm/orca/src/CMakeLists.txt

      - name: Verify wasm32-safe Arachne bead-count saturation
        run: |
          set -euo pipefail
          grep -Fq 'inset_count > std::numeric_limits<size_t>::max() / 2' orcawasm/orca/src/libslic3r/Arachne/WallToolPaths.cpp
          grep -Fq '? std::numeric_limits<size_t>::max()' orcawasm/orca/src/libslic3r/Arachne/WallToolPaths.cpp

      - name: Verify WASM-only OpenCV texture-source exclusion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cmake = Path("orcawasm/orca/src/libslic3r/CMakeLists.txt").read_text(encoding="utf-8")
          guard = (
              "if(SLIC3R_WASM)\n"
              "    list(REMOVE_ITEM lisbslic3r_sources\n"
              "        TexturePainting.cpp\n"
              "        TextureToColor/TextureToColor.cpp\n"
              "    )\n"
              "endif()"
          )
          if cmake.count(guard) != 1:
              raise SystemExit("WASM-only OpenCV texture guard missing or duplicated")
          PY

      - name: Verify exact-only WASM Voronoi predicates (no unsupported FPU rounding)
        shell: bash
        run: |
          set -euo pipefail
          file=orcawasm/orca/src/libslic3r/Geometry/VoronoiUtilsCgal.cpp
          grep -Fq 'using ParabolicTangentToSegmentOrientationPredicateFiltered = ExactWasmPredicate<' "$file"
          grep -Fq 'using ParabolicTangentToParabolicTangentOrientationPredicateFiltered = ExactWasmPredicate<' "$file"
          grep -Fq '#if defined(SLIC3R_WASM) && defined(ARACHNE_DEBUG)' "$file"
          grep -Fq '#include <CGAL/Surface_sweep_2_algorithms.h>' "$file"
          grep -Fq '#if !defined(SLIC3R_WASM)' "$file"

      - name: Verify Boost.Log pthread build configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'STAMP="${INSTALL}/.boost_built_mt_native_eh_v4"' orcawasm/scripts/build-local-wsl.sh
          if grep -Fq 'define=BOOST_LOG_NO_THREADS=1' orcawasm/scripts/build-local-wsl.sh; then
            echo "::error::Boost.Log must be rebuilt with pthread support"
            exit 1
          fi
          if grep -Fq 'BOOST_LOG_NO_THREADS' orcawasm/cmake/wasm_find_paths.cmake; then
            echo "::error::WASM compile definitions still select single-threaded Boost.Log ABI"
            exit 1
          fi

      - name: Verify v2.5.0 capability metadata matches pinned upstream
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bridge = Path("orcawasm/bridge/slicer.cpp").read_text(encoding="utf-8")
          expected = '"engine":{"family":"OrcaSlicer","version":"2.5.0"}'
          if bridge.count(expected) != 1:
              raise SystemExit("WASM engine does not advertise source tag v2.5.0")
          if '"engine":{"family":"OrcaSlicer","version":"2.4.2"}' in bridge:
              raise SystemExit("WASM engine still reports old v2.4.2 metadata")
          PY

      - name: Verify OrcaSlicer v2.5 bridge validation API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bridge = Path("orcawasm/bridge/slicer.cpp").read_text(encoding="utf-8")
          expected = "Slic3r::StringObjectException validation_error = print.validate();"
          if bridge.count(expected) != 1 or "print.validate(&warning)" in bridge:
              raise SystemExit("v2.5.0 Print::validate bridge adaptation missing")
          PY

      - name: Build Assimp 5.4.3 for WebAssembly
        env:
          EMSDK: /opt/emsdk
          EXTRA_CXX_FLAGS: "-fwasm-exceptions -pthread"
          EXTRA_C_FLAGS: "-sSUPPORT_LONGJMP=wasm -pthread"
        run: bash scripts/build-assimp-wasm.sh

      - name: Build Draco 1.5.7 for WebAssembly
        env:
          EMSDK: /opt/emsdk
          # Draco 1.5.7 explicitly tests $ENV{EMSCRIPTEN} in CMake.
          EMSCRIPTEN: /opt/emsdk/upstream/emscripten
          EXTRA_CXX_FLAGS: "-fwasm-exceptions -pthread"
          EXTRA_C_FLAGS: "-sSUPPORT_LONGJMP=wasm -pthread"
        run: bash scripts/build-draco-wasm.sh

      - name: Build OrcaSlicer v2.5.0 as WebAssembly
        id: wasm_build
        env:
          EMSDK: /opt/emsdk
          EMSDK_VERSION: "3.1.74"
          ORCA_VERSION: v2.5.0
          OCCT_VERSION: "7.8.1"
          ONETBB_VERSION: v2021.13.2
          OUTPUT_NAME: slicer-mt
          BOOST_THREADING: multi
          EXTRA_CXX_FLAGS: "-fwasm-exceptions -pthread"
          EXTRA_C_FLAGS: "-sSUPPORT_LONGJMP=wasm -pthread"
        run: |
          set -o pipefail
          cd orcawasm
          bash scripts/build-local-wsl.sh 2>&1 | tee "$GITHUB_WORKSPACE/wasm-candidate-build.log"

      # The upstream build-local-wsl.sh builds all dependencies before CMake
      # configure. Preserve fully installed dependencies even if the subsequent
      # CMake configure/compiler phase fails; otherwise every fix redoes ~40 min
      # of Boost/OCCT/CGAL/oneTBB work.
      - name: Confirm dependencies complete for caching
        id: deps-ready
        if: always()
        shell: bash
        run: |
          if [[ -f orcawasm/deps-install/.assimp_5.4.3_wasm_mt_eh_v1 &&
                -f orcawasm/deps-install/.draco_1.5.7_wasm_mt_eh_v1 &&
                -f orcawasm/deps-install/.math_built_mt_native_eh_v2_cgal_6_2_1 &&
                -f orcawasm/deps-install/.onetbb_v2021.13.2_native_eh_v1 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dependency build was incomplete; not caching partial results."
          fi

      - name: Save complete dependencies even after CMake failure
        if: always() && steps.deps-ready.outputs.ready == 'true' && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            orcawasm/deps-install
            orcawasm/build-wasm/emscripten-cache-mt
            ~/.cache/ccache
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # Preserve a short, searchable compiler/CMake failure excerpt when
      # hosted GitHub Actions job-log retrieval is unavailable or times out.
      # This is diagnostic-only: it never publishes an untested WASM binary.
      - name: Capture failed build diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f wasm-candidate-build.log ]]; then
            {
              echo "## Error context"
              grep -En -B 4 -A 10 '(FAILED:|error:|CMake Error|ninja: build stopped|undefined symbol|fatal error:)' wasm-candidate-build.log | tail -n 350 || true
              echo
              echo "## Final build output"
              tail -n 100 wasm-candidate-build.log
            } > wasm-candidate-failure.txt
            {
              echo "### Failed WASM candidate: diagnostic extract"
              echo '```text'
              tail -n 150 wasm-candidate-failure.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-v2.5.0-failure-diagnostics
          path: wasm-candidate-failure.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Run API conformance tests
        working-directory: orcawasm
        run: node scripts/conformance.mjs --wasm-dir artifacts

      - name: Run asynchronous binding tests
        working-directory: orcawasm
        run: node scripts/binding-test.mjs --wasm-dir artifacts

      # Run this safety assertion even if the unrelated modifier smoke later
      # fails. A failed guard still fails the overall job and never publishes
      # the WASM binary; only the tiny diagnostic JSON is archived.
      - name: Verify imported 3MF provenance guard on rebuilt WASM (non-print)
        if: ${{ !cancelled() && steps.wasm_build.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          set -euo pipefail
          node --check scripts/test-v250-imported-replacement-guard.mjs
          python3 scripts/make_3mf_two_build_fixture.py --output parity-output/independent-core-two-build.3mf
          node scripts/test-v250-imported-replacement-guard.mjs

      - name: Run end-to-end engine smoke test
        if: ${{ !cancelled() && steps.wasm_build.outcome == 'success' }}
        working-directory: orcawasm
        timeout-minutes: 20
        run: node scripts/smoke-test.mjs --wasm-dir artifacts

      - name: Archive imported 3MF provenance result (report only, never WASM)
        if: ${{ always() && steps.wasm_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: experimental-3mf-provenance-report
          path: parity-output/rebuilt-import-replacement-guard.json
          if-no-files-found: warn
          retention-days: 14

      - name: Test native multi-object 3MF export on rebuilt WASM (non-print)
        # Run even if the independent smoke gate fails. No failed build is
        # released; this isolates 3MF regressions from unrelated smoke results.
        if: ${{ !cancelled() && steps.wasm_build.outcome == 'success' }}
        timeout-minutes: 12
        run: node scripts/test-v250-native-multiobject-export.mjs

      - name: Record build metadata
        if: always()
        run: |
          {
            echo "## WebAssembly candidate"
            echo "- Target upstream: OrcaSlicer v2.5.0"
            echo "- WebAssembly source: Hiosdra/OrcaWasm@60a09e04f1990be39c8f6f35dffef1a2c9e224c4"
            echo "- WebAssembly source commit: $(git -C orcawasm rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "- Upstream source commit: $(git -C orcawasm/orca rev-parse HEAD 2>/dev/null || echo unavailable)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: layer-workbench-orcaslicer-v2.5.0-wasm
          path: |
            orcawasm/artifacts/slicer-mt.js
            orcawasm/artifacts/slicer-mt.wasm
          if-no-files-found: error
          retention-days: 30
