name: Check upstream stable release

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api repos/OrcaSlicer/OrcaSlicer/releases/latest)"
          tag="$(jq -r .tag_name <<< "$release")"
          url="$(jq -r .html_url <<< "$release")"
          published="$(jq -r .published_at <<< "$release")"
          echo "Latest stable release: $tag"
          echo "Published: $published"
          echo "Release: $url"
          echo "No engine rebuild is triggered by this check alone."
