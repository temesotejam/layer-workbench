name: Test native versus WASM G-code comparator

on:
  push:
    branches: [main]
    paths:
      - "scripts/compare_gcode.py"
      - "scripts/test_compare_gcode.py"
      - "scripts/check_parity_pair.py"
      - "scripts/test_check_parity_pair.py"
      - "scripts/make_parity_manifest.py"
      - "scripts/test_make_parity_manifest.py"
      - "scripts/orca-multimaterial-gcode-audit.mjs"
      - "scripts/test-orca-multimaterial-gcode-audit.mjs"
      - ".github/workflows/test-gcode-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exercise equality and mismatch detection
        run: |
          python3 -m unittest discover -s scripts -p test_compare_gcode.py -v
          python3 -m unittest discover -s scripts -p test_check_parity_pair.py -v
          python3 -m unittest discover -s scripts -p test_make_parity_manifest.py -v
          node scripts/test-orca-multimaterial-gcode-audit.mjs
