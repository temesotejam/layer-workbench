name: Verify pinned real OrcaSlicer v2.5.0 profiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/orca-profile-collection.mjs"
      - "scripts/orca-full-profile.mjs"
      - "scripts/orca-config-array-semantics.mjs"
      - "scripts/test-orca-config-array-semantics.mjs"
      - "scripts/test-orca-full-profile.mjs"
      - "scripts/orca-vendor-index.mjs"
      - "scripts/orca-vendor-catalog.mjs"
      - "scripts/test-orca-vendor-catalog.mjs"
      - "scripts/test-orca-profile-collection.mjs"
      - "scripts/test-hot-plate-bridge.mjs"
      - "scripts/slice-stl.mjs"
      - "scripts/test-orca-vendor-index.mjs"
      - "scripts/fetch-upstream-v250-fixture.py"
      - "scripts/fetch-upstream-v250-multi-vendor-fixture.py"
      - "scripts/test-upstream-v250-multi-vendor.mjs"
      - "scripts/test-upstream-v250-profiles.mjs"
      - "scripts/test-upstream-v250-creality.mjs"
      - ".github/workflows/verify-real-v250-profiles.yml"

permissions:
  contents: read

jobs:
  source-verified-profile-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate existing isolated profile parsers
        run: |
          set -euo pipefail
          node scripts/test-orca-profile-collection.mjs
          node scripts/test-hot-plate-bridge.mjs
          node scripts/test-orca-vendor-index.mjs
          node scripts/test-orca-vendor-catalog.mjs
          node scripts/test-orca-full-profile.mjs
          node scripts/test-orca-config-array-semantics.mjs
      - name: Fetch pinned actual v2.5.0 upstream profile records
        run: python3 scripts/fetch-upstream-v250-fixture.py
      - name: Validate real index and three-level PLA inheritance
        run: node scripts/test-upstream-v250-profiles.mjs
      - name: Validate real Creality machine and process inheritance
        run: node scripts/test-upstream-v250-creality.mjs
      - name: Fetch pinned multi-vendor machine, process and filament samples
        run: python3 scripts/fetch-upstream-v250-multi-vendor-fixture.py
      - name: Validate real Snapmaker U1, Prusa MK4S and global filament selection
        run: node scripts/test-upstream-v250-multi-vendor.mjs
      # No upload-artifact: upstream profile JSON stays confined to the runner.
