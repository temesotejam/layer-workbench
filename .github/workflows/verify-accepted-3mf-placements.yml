name: Verify accepted WASM candidate 3MF absolute placements

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/test-browser-3mf-multiobject.mjs"
      - "scripts/classify_3mf_hierarchy_gap.py"
      - "scripts/test_classify_3mf_hierarchy_gap.py"
      - "scripts/edit_3mf_build_transform.py"
      - "scripts/test_edit_3mf_build_transform.py"
      - "scripts/native-manifest-edit.mjs"
      - "scripts/test-native-manifest-edit.mjs"
      - "scripts/compare_3mf_metadata.py"
      - "scripts/compare_3mf_build_preservation.py"
      - "scripts/test_compare_3mf_build_preservation.py"
      - "scripts/test-browser-3mf-native-edit.mjs"
      - "scripts/test-candidate-browser-3mf.mjs"
      - "scripts/test-browser-3mf-private-instance-edit.mjs"
      - "scripts/diagnose-edited-3mf-toolpaths.mjs"
      - "scripts/test-diagnose-edited-3mf-toolpaths.mjs"
      - "scripts/diagnose-in-session-3mf-reslice.mjs"
      - "scripts/test-diagnose-in-session-3mf-reslice.mjs"
      - ".github/workflows/verify-accepted-3mf-placements.yml"
  push:
    branches: [main]
    paths:
      - "scripts/classify_3mf_hierarchy_gap.py"
      - "scripts/test_classify_3mf_hierarchy_gap.py"
      - "scripts/test-browser-3mf-multiobject.mjs"
      - "scripts/test-candidate-browser-3mf.mjs"
      - "scripts/test-browser-3mf-private-instance-edit.mjs"
      - "scripts/diagnose-edited-3mf-toolpaths.mjs"
      - "scripts/test-diagnose-edited-3mf-toolpaths.mjs"
      - "scripts/diagnose-in-session-3mf-reslice.mjs"
      - "scripts/test-diagnose-in-session-3mf-reslice.mjs"
      - "scripts/native-manifest-edit.mjs"
      - "scripts/test-native-manifest-edit.mjs"
      - "scripts/compare_3mf_metadata.py"
      - "scripts/compare_3mf_build_preservation.py"
      - "scripts/test_compare_3mf_build_preservation.py"
      - "scripts/test-browser-3mf-native-edit.mjs"
      - "scripts/test-browser-3mf-independent-core-import.mjs"
      - "scripts/make_3mf_two_build_fixture.py"
      - "scripts/edit_3mf_build_transform.py"
      - ".github/workflows/verify-accepted-3mf-placements.yml"

permissions:
  contents: read
  actions: read

# Runs only a fresh Chrome acceptance test against the successful candidate.
# Does not trigger a heavy engine build and never deploys a binary.
jobs:
  check-placements:
    # The verified candidate artifact is shared only with same-repository PRs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Chrome test controller
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Fetch only pinned successful candidate
        uses: actions/download-artifact@v4
        with:
          name: layer-workbench-orcaslicer-v2.5.0-wasm
          repository: temesotejam/layer-workbench
          run-id: 43639277062
          github-token: ${{ github.token }}
          path: engine-test-artifacts
      - name: Build independent synthetic 3MF Core input
        run: python3 scripts/make_3mf_two_build_fixture.py --output parity-output/independent-core-two-build.3mf
      - name: Check pinned artifact and test syntax
        run: |
          set -euo pipefail
          test -s engine-test-artifacts/slicer-mt.js
          test -s engine-test-artifacts/slicer-mt.wasm
          node --check scripts/test-browser-3mf-multiobject.mjs
          node --check scripts/test-candidate-browser-3mf.mjs
          node --check scripts/test-browser-3mf-private-instance-edit.mjs
          node --check scripts/diagnose-edited-3mf-toolpaths.mjs
          node --check scripts/test-diagnose-edited-3mf-toolpaths.mjs
          node scripts/test-diagnose-edited-3mf-toolpaths.mjs
          node --check scripts/diagnose-in-session-3mf-reslice.mjs
          node --check scripts/test-diagnose-in-session-3mf-reslice.mjs
          node scripts/test-diagnose-in-session-3mf-reslice.mjs
          node --check scripts/test-browser-3mf-native-edit.mjs
          node --check scripts/test-browser-3mf-independent-core-import.mjs
          python3 -m py_compile scripts/compare_3mf_build_preservation.py
          python3 -m unittest discover -s scripts -p test_compare_3mf_build_preservation.py -v
          node --check scripts/native-manifest-edit.mjs
          node scripts/test-native-manifest-edit.mjs
      - name: Assert each cube's own XYZ placement in isolated Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve-isolated.py --port 8766 > /tmp/isolated-layer-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:8766/engine-probe.html >/dev/null; then break; fi
            sleep 1
          done
          CHECK_ACCEPTED_SHARED_MESH=1 node scripts/test-candidate-browser-3mf.mjs
          # Audit non-model/opaque ZIP entries independently of the surgical
          # transform utility, while allowing the edited 3D model XML to differ.
          for variant in edited-core-build rotated-core-build scaled-core-build; do
            python3 scripts/compare_3mf_metadata.py \
              --baseline parity-output/independent-core-two-build.3mf \
              --candidate "parity-output/${variant}.3mf" \
              --scope ancillary \
              --report "parity-output/${variant}-ancillary-preservation.json"
            # Independent exact-byte verification of EVERYTHING inside the
            # Core model XML except a single selected build transform value.
            python3 scripts/compare_3mf_build_preservation.py \
              --baseline parity-output/independent-core-two-build.3mf \
              --candidate "parity-output/${variant}.3mf" \
              --report "parity-output/${variant}-core-model-preservation.json"
          done
          # Core input was generated independently of the WASM exporter.
          # The probe records unsupported imports separately from strict
          # accepted-candidate invariants, without claiming desktop parity.
          if test -s parity-output/independent-core-converted.stl; then
            python3 scripts/check_3mf_stl_bounds.py \
              --input parity-output/independent-core-two-build.3mf \
              --stl parity-output/independent-core-converted.stl \
              --report parity-output/independent-core-geometry-comparison.json
          fi
          # The private C ABI must change real flattened geometry, not only
          # manifest X values. These are synthetic Core 3MF diagnostics.
          python3 scripts/audit_3mf_scene.py \
            --input parity-output/browser-private-edited-instance.3mf \
            --expected-build-items 2 --min-triangles 24 \
            --report parity-output/private-edited-instance-scene.json
          python3 scripts/check_3mf_stl_bounds.py \
            --input parity-output/browser-private-edited-instance.3mf \
            --stl parity-output/browser-private-edited-instance.stl \
            --report parity-output/private-edited-instance-stl-comparison.json
          python3 scripts/audit_3mf_scene.py \
            --input parity-output/wasm-edited-manifest-instance.3mf \
            --expected-build-items 2 --min-triangles 24 \
            --report parity-output/accepted-edited-manifest-3mf-scene.json
          python3 scripts/check_3mf_stl_bounds.py \
            --input parity-output/wasm-edited-manifest-instance.3mf \
            --stl parity-output/wasm-edited-manifest-instance.stl \
            --report parity-output/accepted-edited-manifest-stl-comparison.json
          python3 scripts/audit_3mf_scene.py \
            --input parity-output/wasm-multiobject-3mf.3mf \
            --expected-build-items 2 --min-triangles 24 \
            --report parity-output/accepted-candidate-3mf-scene.json
          python3 scripts/check_3mf_stl_bounds.py \
            --input parity-output/wasm-multiobject-3mf.3mf \
            --stl parity-output/wasm-multiobject-converted.stl \
            --report parity-output/accepted-candidate-3mf-stl-comparison.json
          # Compare the accepted (patched) exporter to the legacy candidate
          # with the same shared-source fixture and independent Core audit.
          # A diagnostic classification is not a parity acceptance result.
          python3 scripts/audit_3mf_scene.py \
            --input parity-output/wasm-sharedmesh-3mf.3mf \
            --min-triangles 24 \
            --report parity-output/accepted-sharedmesh-scene.json
          python3 scripts/check_3mf_stl_bounds.py \
            --input parity-output/wasm-sharedmesh-3mf.3mf \
            --stl parity-output/wasm-sharedmesh-converted.stl \
            --report parity-output/accepted-sharedmesh-stl-comparison.json
          python3 scripts/classify_3mf_hierarchy_gap.py \
            --summary parity-output/wasm-sharedmesh-3mf-summary.json \
            --scene parity-output/accepted-sharedmesh-scene.json \
            --report parity-output/accepted-sharedmesh-hierarchy-stage.json
      - name: Retain diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accepted-candidate-3mf-placement-evidence
          path: parity-output/
          if-no-files-found: warn
          retention-days: 14
