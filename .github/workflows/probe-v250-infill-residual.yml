# CI-only follow-up to #246; reuse exact artifact from run 45678945323.
# No compiler job, no public artifact promotion. The artifact expires 2026-11-26 UTC.
name: Localize v2.5.0 experimental infill residual
on:
  pull_request:
    paths:
      - '.github/workflows/probe-v250-infill-residual.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: experimental-v250-infill-residual
  cancel-in-progress: false
jobs:
  same-archive:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/v250-infill-residual-localization' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c4ff91c2c8bcccdb5818cc56087cb22509e1005e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser test and matching regressions
        run: |
          node --check scripts/test-native-cli-3mf-to-wasm.mjs
          node --check scripts/preserve-native-source-translation.mjs
          node scripts/test-audit-native-3mf-world-facets.mjs
          python3 -m unittest discover -s scripts -p test_edit_native_3mf_build_transform.py -v
          python3 -m unittest discover -s scripts -p test_verify_native_3mf_edit_effect.py -v
          python3 -m unittest discover -s scripts -p test_compare_native_3mf_world_facets.py -v
          python3 -m unittest discover -s scripts -p test_audit_native_3mf_metadata_loss.py -v
          python3 -m unittest discover -s scripts -p test_verify_native_gcode_repeatability.py -v
          python3 -m unittest discover -s scripts -p test_gcode_lexical_attribution.py -v
          python3 -m unittest discover -s scripts -p test_audit_gcode_infill_config.py -v
          python3 -m unittest discover -s scripts -p test_make_anchor_zero_control.py -v
          npm install --no-save --no-package-lock playwright@1.56.1 fflate@0.8.2
      - name: Download the official v2.5.0 Linux AppImage only inside CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-cli-output
          asset="OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          url="https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.5.0/${asset}"
          curl --fail --location --show-error --silent --retry 3 \
            --retry-all-errors --max-time 360 --max-filesize 800000000 \
            "${url}" -o "${RUNNER_TEMP}/${asset}"
          test "$(wc -c < "${RUNNER_TEMP}/${asset}")" -gt 50000000
          file "${RUNNER_TEMP}/${asset}" | tee native-cli-output/appimage-format.txt
          grep -q 'ELF' native-cli-output/appimage-format.txt
          sha256sum "${RUNNER_TEMP}/${asset}" | tee native-cli-output/official-v250-appimage.sha256
          # Observed on the official release asset in two independent PR CI downloads.
          actual="$(sha256sum "${RUNNER_TEMP}/${asset}" | cut -d ' ' -f1)"
          test "${actual}" = "d13eb0a9cd618ed080ab6b82c64c0a60c4501aac91e88d5ac2c3b526fb141a7c"
          chmod +x "${RUNNER_TEMP}/${asset}"
      - name: Install the host libraries required by the official AppImage
        shell: bash
        run: |
          set -euo pipefail
          # Hosted runners sometimes select a very slow regional EC2
          # Ubuntu mirror; the last two PR probes reached the job timeout
          # while downloading ordinary dependencies. Change only that mirror
          # on this ephemeral runner, retaining Ubuntu's signed repositories
          # and its separate security source.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "${source}" ] && grep -Eq '([a-z0-9-]+\.)?ec2\.archive\.ubuntu\.com' "${source}"; then
              sudo sed -i -E 's@https?://[a-z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu@http://archive.ubuntu.com/ubuntu@g' "${source}"
              echo "Switched regional EC2 archive mirror to standard Ubuntu archive in ${source}"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            libopengl0 libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 libglu1-mesa
      - name: Prepare pinned full native v2.5.0 machine, process and filament presets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-prepare-native-v250-presets.mjs
          # Upstream JSON stays ephemeral on the runner. Source revision is
          # pinned in the fetcher and asserted again during materialization.
          python3 scripts/fetch-upstream-v250-fixture.py
          node scripts/prepare-native-v250-presets.mjs \
            upstream-v250-creality-fixture.json upstream-v250-filament-fixture.json \
            native-cli-output/native-profiles
          # Preserve only the provenance and digest manifest in CI artifacts.
          cp native-cli-output/native-profiles/manifest.json native-cli-output/native-profiles-manifest.log

      - name: Generate official native multipart project in CI
        shell: bash
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          python3 scripts/make_3mf_two_build_fixture.py --output native-cli-output/two-build-items.3mf
          project="${PWD}/native-cli-output/native-v250-project.3mf"
          timeout 180s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/two-build-items.3mf \
            --load-settings "native-cli-output/native-profiles/process.json;native-cli-output/native-profiles/machine.json" \
            --load-filaments native-cli-output/native-profiles/filament.json \
            --arrange 0 --export-3mf "${project}" \
            > native-cli-output/native-project-export.log 2>&1 || {
              tail -n 120 native-cli-output/native-project-export.log
              exit 1
            }
          test -s "${project}"
          python3 scripts/verify_native_3mf_package.py --input "${project}"
          # Independently compose Core build and external-component transforms.
          # Keep the original oriented facets private to this disposable runner.
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from compare_native_3mf_world_facets import _world_facets
          rows = _world_facets('native-cli-output/native-v250-project.3mf')
          if [row['triangle_count'] for row in rows] != [12, 12]:
              raise SystemExit('Unexpected native fixture facet counts')
          Path('native-cli-output/native-world-facets.json').write_text(
              json.dumps([row['oriented_facets'] for row in rows]))
          PY
      - name: Translate one native build item offline and audit non-target bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/edit_native_3mf_build_transform.py \
            --input native-cli-output/native-v250-project.3mf \
            --output native-cli-output/native-v250-project-translated.3mf \
            --build-index 0 --translate-mm 12 -7 0
          python3 scripts/verify_native_3mf_edit_effect.py \
            --baseline native-cli-output/native-v250-project.3mf \
            --candidate native-cli-output/native-v250-project-translated.3mf \
            --build-index 0 --translate-mm 12 -7 0
      - name: Fetch accepted WASM candidate (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: layer-workbench-orcaslicer-v2.5.0-wasm
          repository: temesotejam/layer-workbench
          run-id: 45284215349
          github-token: ${{ github.token }}
          path: engine-test-artifacts
      - name: Native CLI project to isolated Chrome WASM
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve-isolated.py --port 8766 > /tmp/isolated-layer-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:8766/engine-probe.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-native-cli-3mf-to-wasm.mjs
          node scripts/test-native-cli-3mf-to-wasm.mjs --translated
          node scripts/test-native-cli-3mf-to-wasm.mjs --private-edit

      - name: Quantify native config and package loss without printing settings
        shell: bash
        run: |
          set -euo pipefail
          # Positive control: the independent offline translation preserved
          # metadata member bytes. Do not lower this gate for WASM.
          python3 scripts/audit_native_3mf_metadata_loss.py \
            --baseline native-cli-output/native-v250-project.3mf \
            --candidate native-cli-output/native-v250-project-translated.3mf \
            --require-identical-config
          # Best effort intentionally allows metadata loss. Report counts
          # even when the candidate has no native config members. Geometry
          # acceptance and strict preservation rejection remain separate.
          python3 scripts/audit_native_3mf_metadata_loss.py \
            --baseline native-cli-output/native-v250-project.3mf \
            --candidate native-cli-output/wasm-private-edited.3mf

      - name: Require source-preserving browser edit to keep every non-target member
        shell: bash
        run: |
          set -euo pipefail
          # Select the left-hand original build independently from Core facets.
          index="$(python3 - <<'PY'
          import json
          from pathlib import Path
          groups=json.loads(Path('native-cli-output/native-world-facets.json').read_text())
          assert len(groups)==2
          bounds=[(min(p[0] for f in g for p in f),max(p[0] for f in g for p in f)) for g in groups]
          index=min(range(2),key=lambda i:bounds[i][0])
          assert bounds[index][1]+12<bounds[1-index][0]
          print(index)
          PY
          )"
          python3 scripts/verify_native_3mf_edit_effect.py \
            --baseline native-cli-output/native-v250-project.3mf \
            --candidate native-cli-output/browser-source-preserving-edited.3mf \
            --build-index "${index}" --translate-mm 12 -7 0
          python3 scripts/audit_native_3mf_metadata_loss.py \
            --baseline native-cli-output/native-v250-project.3mf \
            --candidate native-cli-output/browser-source-preserving-edited.3mf \
            --require-identical-config

      - name: Fetch exact prior experimental artifact (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: experimental-v250-arc-order-wasm
          repository: temesotejam/layer-workbench
          run-id: 45678945323
          github-token: ${{ github.token }}
          path: experimental-engine-artifacts
      - name: Compare official and both WASM engines using one unchanged archive
        shell: bash
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          input="${PWD}/native-cli-output/browser-source-preserving-edited.3mf"
          sha256sum "${input}" > "${RUNNER_TEMP}/same-archive.sha256"
          out="${PWD}/native-cli-output/same-archive-native"
          mkdir "${out}"
          timeout 180s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            "${input}" --arrange 0 --slice 0 --outputdir "${out}" \
            > "${out}/native-slice.log" 2>&1
          test -s "${out}/plate_1.gcode"
          python3 scripts/serve-isolated.py --port 8766 > /tmp/isolated-layer-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:8766/engine-probe.html >/dev/null; then break; fi
            sleep 1
          done
          timeout 240s node scripts/test-native-cli-3mf-to-wasm.mjs --slice-embedded
          mv native-cli-output/same-archive-wasm.gcode native-cli-output/baseline-wasm.gcode
          sha256sum -c "${RUNNER_TEMP}/same-archive.sha256"
          for file in slicer-mt.js slicer-mt.wasm; do
            test -s "experimental-engine-artifacts/${file}"
            cp "experimental-engine-artifacts/${file}" "engine-test-artifacts/${file}"
          done
          timeout 240s node scripts/test-native-cli-3mf-to-wasm.mjs --slice-embedded
          sha256sum -c "${RUNNER_TEMP}/same-archive.sha256"
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from compare_gcode import compare
          from gcode_lexical_attribution import compare_lexical
          from audit_gcode_infill_config import parse_config
          root = Path('native-cli-output')
          native = root / 'same-archive-native/plate_1.gcode'
          baseline = root / 'baseline-wasm.gcode'
          candidate = root / 'same-archive-wasm.gcode'
          if sorted(native.parent.rglob('*.gcode')) != [native]:
              raise SystemExit('Expected exactly one native plate')
          if not all(1024 <= p.stat().st_size <= 12_000_000 for p in (native, baseline, candidate)):
              raise SystemExit('Invalid diagnostic G-code size')
          a, b = parse_config(baseline), parse_config(candidate)
          if not a or not b or a != b:
              raise SystemExit('Experimental and accepted serialized settings differ or are unavailable')
          if a.get('infill_anchor') in (None, '0', '0%') or a.get('infill_anchor_max') in (None, '0', '0%'):
              raise SystemExit('Normal nonzero anchor settings required')
          from collections import Counter, defaultdict
          from decimal import Decimal
          from math import isclose
          from compare_gcode import canonical, extrusion_move_metrics, gcode_feature_context
          from gcode_lexical_attribution import compare_collinear_coverage
          from compare_native_3mf_world_facets import _world_facets

          def split_sparse(strokes, bounds):
              result = [defaultdict(list), defaultdict(list)]
              for s in strokes:
                  z, feature, start, end, _ = s
                  if feature != 'sparse infill':
                      continue
                  hits = [i for i, (lo, hi) in enumerate(bounds)
                          if lo <= start[0] <= hi and lo <= end[0] <= hi]
                  if len(hits) != 1:
                      raise ValueError('Sparse stroke outside unique fixture X interval')
                  result[hits[0]][z].append(s)
              if not all(result):
                  raise ValueError('Both fixture objects must have sparse infill')
              return result

          def object_plane_report(a, b):
              if set(a) != set(b):
                  raise ValueError('Different sparse Z support in fixture object')
              histogram = Counter()
              total = [0.0, 0.0, 0.0]
              for z in sorted(a):
                  c = compare_collinear_coverage(a[z], b[z])
                  if c['status'] != 'measured':
                      raise ValueError('Unsupported object-plane geometry')
                  v = c['by_feature']['sparse infill']
                  row = tuple(v[k] for k in
                              ('native_unmatched_mm', 'wasm_unmatched_mm', 'shared_mm'))
                  if row[0] or row[1]:
                      histogram[row[:2]] += 1
                  for i, n in enumerate(row):
                      total[i] += n
              if len(histogram) > 128:
                  raise ValueError('Residual histogram exceeds fixture bound')
              return dict(planes=len(a), changed_planes=sum(histogram.values()),
                          unmatched_histogram=[dict(native_mm=k[0], wasm_mm=k[1], planes=n)
                                               for k, n in sorted(histogram.items())],
                          totals_mm=[round(t, 6) for t in total])

          # Synthetic regression: one object differs on one plane only.
          D = Decimal
          def stroke(x, end, z):
              return (D(z), 'sparse infill', (D(x), D(0)), (D(end), D(0)), D(1))
          limits = [(D(0), D(10)), (D(20), D(30))]
          sa = [stroke(1, 5, 1), stroke(21, 25, 1), stroke(1, 5, 2)]
          sb = [stroke(2, 6, 1), stroke(21, 25, 1), stroke(1, 5, 2)]
          aa, bb = split_sparse(sa, limits), split_sparse(sb, limits)
          assert object_plane_report(aa[0], bb[0])['totals_mm'] == [1., 1., 7.]
          assert object_plane_report(aa[1], bb[1])['changed_planes'] == 0
          try:
              split_sparse(sa + [stroke(5, 25, 1)], limits)
          except ValueError:
              pass
          else:
              raise AssertionError('Cross-object stroke accepted')
          print('PASS: synthetic residual localization and refusal', flush=True)

          facets = _world_facets(str(root / 'browser-source-preserving-edited.3mf'))
          bounds = sorted((D(str(min(p[0] for f in g['oriented_facets'] for p in f))) - D('0.1'),
                           D(str(max(p[0] for f in g['oriented_facets'] for p in f))) + D('0.1'))
                          for g in facets)
          if len(bounds) != 2 or bounds[0][1] >= bounds[1][0]:
              raise ValueError('Fixture X intervals overlap')
          def trace(path):
              commands = canonical(path)
              if len(commands) > 100000:
                  raise ValueError('Command bound exceeded')
              strokes = []
              metrics = extrusion_move_metrics(commands, gcode_feature_context(path),
                                               planar_strokes=strokes)
              if metrics[1] is None:
                  raise ValueError('Invalid fixture motion')
              return split_sparse(strokes, bounds)

          def localize(label, x, y, sparse, coverage):
              ta, tb = trace(x), trace(y)
              rows = [object_plane_report(a, b) for a, b in zip(ta, tb)]
              for i, key in enumerate(('native_unmatched_mm', 'wasm_unmatched_mm', 'shared_mm')):
                  # Per-plane reports round to 1e-6 mm; permit only accumulated rounding.
                  if not isclose(sum(row['totals_mm'][i] for row in rows),
                                 sparse[key], rel_tol=0., abs_tol=0.001):
                      raise ValueError('Object-plane totals disagree with global coverage')
              print('ARC_RESIDUAL_LOCALIZATION ' + json.dumps(
                  dict(label=label, objects=rows, features=coverage['by_feature'],
                       sparse_line_alignment=coverage['sparse_line_alignment'],
                       semantic_equivalence_verified=False), sort_keys=True), flush=True)
          def measure(label, x, y):
              strict = compare(x, y, min_extrusion_moves=100)
              if strict['input_issues']:
                  raise SystemExit('Invalid strict comparison input: ' + label)
              geo = compare_lexical(x, y)['planar_stroke_diagnostics']
              if geo['status'] != 'measured':
                  raise SystemExit('Unavailable geometry: ' + label)
              coverage = geo['collinear_coverage']
              sparse = coverage['by_feature']['sparse infill']
              localize(label, x, y, sparse, coverage)
              report = {k: strict[k] for k in ('match', 'mismatched_commands', 'native_commands',
                        'wasm_commands', 'native_extrusion_moves', 'wasm_extrusion_moves')}
              report.update(label=label, sparse=sparse, identical_source_archive=True,
                            effective_full_profile_equivalence_verified=False, usable_for_printing=False)
              print('EXPERIMENTAL_ARC_ENGINE ' + json.dumps(report, sort_keys=True), flush=True)
              return strict['match'], sparse
          _, old = measure('official-vs-accepted', native, baseline)
          passed, new = measure('official-vs-experimental', native, candidate)
          measure('accepted-vs-experimental', baseline, candidate)
          print('EXPERIMENTAL_ARC_DELTA ' + json.dumps({k: new[k] - old[k] for k in
                ('native_unmatched_mm', 'wasm_unmatched_mm', 'shared_mm')}, sort_keys=True))
          if not passed:
              raise SystemExit('Experimental strict ordered G-code comparison FAIL')
          print('PASS: this fixture only; no artifact promotion or print-safety claim')
          PY
          # No original profiles, archives, or raw G-code are uploaded.
