name: Probe official OrcaSlicer v2.5.0 native CLI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/probe-native-v250-cli.yml"
      - "scripts/make_3mf_two_build_fixture.py"
      - "scripts/verify_native_exported_stl.py"
      - "scripts/test_verify_native_exported_stl.py"
      - "scripts/prepare-native-v250-presets.mjs"
      - "scripts/test-prepare-native-v250-presets.mjs"
      - "scripts/verify_native_layer_height.py"
      - "scripts/test_verify_native_layer_height.py"
      - "scripts/verify_native_nozzle_temperature.py"
      - "scripts/test_verify_native_nozzle_temperature.py"
      - "scripts/verify_native_outer_wall_speed.py"
      - "scripts/verify_native_bridge_speed.py"
      - "scripts/test_verify_native_bridge_speed.py"
      - "scripts/export-bridge-arch-stl.mjs"
      - "scripts/wrap_bridge_arch_3mf.py"
      - "scripts/test_wrap_bridge_arch_3mf.py"
      - "scripts/test-export-bridge-arch-stl.mjs"
      - "scripts/bridge-arch-fixture.mjs"
      - "scripts/obj-to-stl.mjs"
      - "scripts/initial-layer-travel-diagnostic.mjs"
      - "scripts/test-initial-layer-travel-diagnostic.mjs"
      - "scripts/gcode-preview-parser.mjs"
      - "scripts/verify-native-initial-layer-travel.mjs"
      - "scripts/test-verify-native-initial-layer-travel.mjs"
      - "scripts/test_verify_native_outer_wall_speed.py"
      - "scripts/verify_native_gcode_repeatability.py"
      - "scripts/test_verify_native_gcode_repeatability.py"
      - "scripts/fetch-upstream-v250-fixture.py"
      - "scripts/orca-full-profile.mjs"
      - "scripts/orca-vendor-index.mjs"
      - "scripts/parity-cube-fixture.mjs"
      - "scripts/test-parity-cube-fixture.mjs"
      - "scripts/diagnose_live_cube_pair.py"
      - "scripts/test_diagnose_live_cube_pair.py"
      - "scripts/wrap_parity_cube_3mf.py"
      - "scripts/test_wrap_parity_cube_3mf.py"
      - "scripts/audit_native_parity_cube_geometry.py"
      - "scripts/test_audit_native_parity_cube_geometry.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-native-v250-cli.yml"
      - "scripts/make_3mf_two_build_fixture.py"
      - "scripts/verify_native_exported_stl.py"
      - "scripts/test_verify_native_exported_stl.py"
      - "scripts/prepare-native-v250-presets.mjs"
      - "scripts/test-prepare-native-v250-presets.mjs"
      - "scripts/verify_native_layer_height.py"
      - "scripts/test_verify_native_layer_height.py"
      - "scripts/verify_native_nozzle_temperature.py"
      - "scripts/test_verify_native_nozzle_temperature.py"
      - "scripts/verify_native_outer_wall_speed.py"
      - "scripts/verify_native_bridge_speed.py"
      - "scripts/test_verify_native_bridge_speed.py"
      - "scripts/export-bridge-arch-stl.mjs"
      - "scripts/wrap_bridge_arch_3mf.py"
      - "scripts/test_wrap_bridge_arch_3mf.py"
      - "scripts/test-export-bridge-arch-stl.mjs"
      - "scripts/bridge-arch-fixture.mjs"
      - "scripts/obj-to-stl.mjs"
      - "scripts/initial-layer-travel-diagnostic.mjs"
      - "scripts/test-initial-layer-travel-diagnostic.mjs"
      - "scripts/gcode-preview-parser.mjs"
      - "scripts/verify-native-initial-layer-travel.mjs"
      - "scripts/test-verify-native-initial-layer-travel.mjs"
      - "scripts/test_verify_native_outer_wall_speed.py"
      - "scripts/verify_native_gcode_repeatability.py"
      - "scripts/test_verify_native_gcode_repeatability.py"
      - "scripts/fetch-upstream-v250-fixture.py"
      - "scripts/orca-full-profile.mjs"
      - "scripts/orca-vendor-index.mjs"
      - "scripts/parity-cube-fixture.mjs"
      - "scripts/test-parity-cube-fixture.mjs"
      - "scripts/diagnose_live_cube_pair.py"
      - "scripts/test_diagnose_live_cube_pair.py"
      - "scripts/wrap_parity_cube_3mf.py"
      - "scripts/test_wrap_parity_cube_3mf.py"
      - "scripts/audit_native_parity_cube_geometry.py"
      - "scripts/test_audit_native_parity_cube_geometry.py"

permissions:
  contents: read
  actions: read

jobs:
  native-cli-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit-test shared source STL to explicit Core 3MF conversion offline
        run: python3 -m unittest discover -s scripts -p test_wrap_parity_cube_3mf.py -v

      - name: Unit-test native shared-cube face-level geometry gate offline
        run: python3 -m unittest discover -s scripts -p test_audit_native_parity_cube_geometry.py -v

      - name: Unit-test fail-closed G-code paired diagnostic offline
        run: python3 -m unittest discover -s scripts -p test_diagnose_live_cube_pair.py -v

      - name: Unit-test the STL placement audit offline
        run: python3 -m unittest discover -s scripts -p test_verify_native_exported_stl.py -v

      - name: Unit-test native effective layer-height audit offline
        run: python3 -m unittest discover -s scripts -p test_verify_native_layer_height.py -v

      - name: Unit-test native nozzle-heater command audit offline
        run: python3 -m unittest discover -s scripts -p test_verify_native_nozzle_temperature.py -v

      - name: Unit-test native outer-wall deposition speed audit offline
        run: python3 -m unittest discover -s scripts -p test_verify_native_outer_wall_speed.py -v

      - name: Unit-test shared first-layer F and deposited-E comparison offline
        run: node scripts/test-initial-layer-travel-diagnostic.mjs

      - name: Unit-test native first-layer travel F diagnostic offline
        run: node scripts/test-verify-native-initial-layer-travel.mjs

      - name: Unit-test native ordered-command repeatability audit offline
        run: python3 -m unittest discover -s scripts -p test_verify_native_gcode_repeatability.py -v

      - name: Download the official v2.5.0 Linux AppImage only inside CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-cli-output
          asset="OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          url="https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.5.0/${asset}"
          curl --fail --location --show-error --silent --retry 3 \
            --retry-all-errors --max-time 360 --max-filesize 800000000 \
            "${url}" -o "${RUNNER_TEMP}/${asset}"
          test "$(wc -c < "${RUNNER_TEMP}/${asset}")" -gt 50000000
          file "${RUNNER_TEMP}/${asset}" | tee native-cli-output/appimage-format.txt
          grep -q 'ELF' native-cli-output/appimage-format.txt
          sha256sum "${RUNNER_TEMP}/${asset}" | tee native-cli-output/official-v250-appimage.sha256
          # Observed on the official release asset in two independent PR CI downloads.
          actual="$(sha256sum "${RUNNER_TEMP}/${asset}" | cut -d ' ' -f1)"
          test "${actual}" = "d13eb0a9cd618ed080ab6b82c64c0a60c4501aac91e88d5ac2c3b526fb141a7c"
          chmod +x "${RUNNER_TEMP}/${asset}"

      - name: Install the host libraries required by the official AppImage
        shell: bash
        run: |
          set -euo pipefail
          # Hosted runners sometimes select a very slow regional EC2
          # Ubuntu mirror; the last two PR probes reached the job timeout
          # while downloading ordinary dependencies. Change only that mirror
          # on this ephemeral runner, retaining Ubuntu's signed repositories
          # and its separate security source.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "${source}" ] && grep -Eq '([a-z0-9-]+\.)?ec2\.archive\.ubuntu\.com' "${source}"; then
              sudo sed -i -E 's@https?://[a-z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu@http://archive.ubuntu.com/ubuntu@g' "${source}"
              echo "Switched regional EC2 archive mirror to standard Ubuntu archive in ${source}"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            libopengl0 libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 libglu1-mesa

      - name: Exercise official native headless help and independent Core 3MF import
        shell: bash
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          python3 scripts/make_3mf_two_build_fixture.py \
            --output native-cli-output/two-build-items.3mf
          # Extract-and-run avoids the runner's FUSE device dependency.
          # No print commands, printer networking, or G-code export are invoked.
          timeout 120s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" --help \
            > native-cli-output/native-help.log 2>&1 || {
              cat native-cli-output/native-help.log
              exit 1
            }
          test -s native-cli-output/native-help.log
          grep -Fq "OrcaSlicer-2.5.0" native-cli-output/native-help.log
          grep -Fq -- "--slice" native-cli-output/native-help.log
          grep -Fq -- "--load-settings" native-cli-output/native-help.log
          grep -Fq -- "--load-filaments" native-cli-output/native-help.log
          timeout 120s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/two-build-items.3mf --info \
            > native-cli-output/native-info.log 2>&1 || {
              cat native-cli-output/native-info.log
              exit 1
            }
          test -s native-cli-output/native-info.log
          # The official CLI's --info lists two Core 3MF build items.
          # This does not certify their native plate transforms.
          python3 - <<'PY'
          import re
          from pathlib import Path
          info = Path("native-cli-output/native-info.log").read_text(encoding="utf-8")
          headers = re.findall(r"(?m)^\[two-build-items\.3mf\]$", info)
          facets = re.findall(r"(?m)^number_of_facets\s*=\s*(\d+)$", info)
          manifolds = re.findall(r"(?m)^manifold\s*=\s*(\w+)$", info)
          sizes = re.findall(r"(?m)^size_x\s*=\s*([0-9.]+)$", info)
          if not (len(headers) == 2 and facets == ["12", "12"]
                  and manifolds == ["yes", "yes"]
                  and len(sizes) == 2 and all(abs(float(s) - 20) < 1e-5 for s in sizes)):
              raise SystemExit("Native v2.5.0 --info did not identify both manifold 20 mm Core 3MF cubes")
          print("PASS: official v2.5.0 native --info recognized two manifold 12-facet 20mm cubes")
          PY
          echo "PASS: official v2.5.0 CLI --help and synthetic Core 3MF --info"
          # The headless test only proves CLI startup and model inspection.
          # It is not a native G-code result, full-profile comparison or 3MF round-trip.

      - name: Check native Core 3MF export placement with real geometry
        shell: bash
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          mkdir -p native-cli-output/stl-export
          # Preserve explicit Core 3MF placements; default CLI auto-arrange
          # moved the cubes from (90,90)/(150,90) to adjacent Y positions.
          timeout 120s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/two-build-items.3mf \
            --arrange 0 --export-stl --outputdir native-cli-output/stl-export \
            > native-cli-output/native-export-stl.log 2>&1 || {
              cat native-cli-output/native-export-stl.log
              exit 1
            }
          mapfile -d '' stls < <(find native-cli-output -type f -iname '*.stl' -print0)
          printf "STL export files (count=%s):\n" "${#stls[@]}"
          printf "  %s\n" "${stls[@]}"
          if [ "${#stls[@]}" -lt 1 ] || [ "${#stls[@]}" -gt 2 ]; then
            cat native-cli-output/native-export-stl.log
            echo "Expected one combined or two per-item native STL files, got ${#stls[@]}"
            exit 1
          fi
          python3 scripts/verify_native_exported_stl.py "${stls[@]}" \
            | tee native-cli-output/native-stl-geometry.log
          sha256sum "${stls[@]}" | tee native-cli-output/native-stl.sha256
          echo "PASS: official native v2.5.0 preserved both synthetic Core 3MF build placements"

      - name: Prepare pinned full native v2.5.0 machine, process and filament presets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-prepare-native-v250-presets.mjs
          # Upstream JSON stays ephemeral on the runner. Source revision is
          # pinned in the fetcher and asserted again during materialization.
          python3 scripts/fetch-upstream-v250-fixture.py
          node scripts/prepare-native-v250-presets.mjs \
            upstream-v250-creality-fixture.json upstream-v250-filament-fixture.json \
            native-cli-output/native-profiles
          # Preserve only the provenance and digest manifest in CI artifacts.
          cp native-cli-output/native-profiles/manifest.json native-cli-output/native-profiles-manifest.log

      - name: Attempt real official-native v2.5.0 slicing with source-pinned full presets
        shell: bash
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          mkdir -p native-cli-output/native-gcode
          timeout 240s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/two-build-items.3mf \
            --load-settings "native-cli-output/native-profiles/process.json;native-cli-output/native-profiles/machine.json" \
            --load-filaments native-cli-output/native-profiles/filament.json \
            --arrange 0 --slice 0 --outputdir native-cli-output/native-gcode \
            > native-cli-output/native-slice.log 2>&1 || {
              tail -n 140 native-cli-output/native-slice.log
              exit 1
            }
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from compare_gcode import canonical, count_motion, count_extrusion_moves
          paths = sorted(Path("native-cli-output/native-gcode").rglob("*.gcode"))
          if not 1 <= len(paths) <= 2:
              raise SystemExit(f"Expected one or two actual native G-code outputs; got {paths}")
          for path in paths:
              if not 1024 <= path.stat().st_size <= 20_000_000:
                  raise SystemExit(f"Native G-code empty or out of bounds: {path}")
              commands = canonical(path)
              moves = count_motion(commands)
              extrusion = count_extrusion_moves(commands)
              print("NATIVE GCODE",path.name,"SHA256",hashlib.sha256(path.read_bytes()).hexdigest(),
                    "commands",len(commands),"moves",moves,"extrusion",extrusion)
              if moves < 100 or extrusion < 100:
                  raise SystemExit("Native CLI slicing produced too few real extrusion moves")
          print("PASS: official-native full-profile CLI emitted bounded G-code with real XY extrusion")
          PY
          sha256sum native-cli-output/native-gcode/*.gcode > native-cli-output/native-gcode.sha256
          # G-code is diagnostic, NOT print-ready, and never deployed or archived.

      - name: Prove native first-layer travel percent affects actual modal G-code F
        shell: bash
        run: |
          set -euo pipefail
          # The baseline official native G-code is already generated from the
          # full source-pinned process. Only initial_layer_travel_speed changes.
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("native-cli-output/native-profiles/process.json")
          process = json.loads(source.read_text(encoding="utf-8"))
          if process.get("initial_layer_travel_speed") != "50%":
              raise SystemExit("Unexpected official CR-10 initial_layer_travel_speed")
          if str(process.get("travel_speed")) not in ("80", "130", "150", "180", "200"):
              print("INFO: native source-pinned travel_speed:", process.get("travel_speed"))
          process["initial_layer_travel_speed"] = "100%"
          target = Path("native-cli-output/native-profiles/process-first-travel-100.json")
          target.write_text(json.dumps(process, indent=2) + "\n", encoding="utf-8")
          target.chmod(0o600)
          PY
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          mkdir -p native-cli-output/native-gcode-first-travel-100
          timeout 240s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/two-build-items.3mf \
            --load-settings "native-cli-output/native-profiles/process-first-travel-100.json;native-cli-output/native-profiles/machine.json" \
            --load-filaments native-cli-output/native-profiles/filament.json \
            --arrange 0 --slice 0 --outputdir native-cli-output/native-gcode-first-travel-100 \
            > native-cli-output/native-first-travel-slice.log 2>&1 || {
              tail -n 140 native-cli-output/native-first-travel-slice.log
              exit 1
            }
          test -s native-cli-output/native-gcode-first-travel-100/plate_1.gcode
          node scripts/verify-native-initial-layer-travel.mjs \
            --baseline native-cli-output/native-gcode/plate_1.gcode \
            --altered native-cli-output/native-gcode-first-travel-100/plate_1.gcode \
            --report native-cli-output/native-first-travel-audit.log
          sha256sum native-cli-output/native-gcode-first-travel-100/plate_1.gcode \
            > native-cli-output/native-gcode-first-travel-100.sha256
          # Raw G-code and licensed profiles remain private to the CI runner.

      - name: Slice byte-identical cube geometry at explicitly matched build placement
        shell: bash
        run: |
          set -euo pipefail
          # Generate the same 684-byte STL as the WASM browser probe.
          # The official native CLI consumes a minimal Core 3MF wrapper to
          # specify the WASM manifest's translation (128,128,0) without auto-arrange.
          # The native input container differs, and full profiles still differ.
          node scripts/test-parity-cube-fixture.mjs
          node scripts/parity-cube-fixture.mjs native-cli-output/parity-cube.stl
          sha256sum native-cli-output/parity-cube.stl > native-cli-output/parity-cube.stl.sha256
          test "$(cut -d ' ' -f1 native-cli-output/parity-cube.stl.sha256)" = \
            "7b59223183b5c34815cbf197e1207b108932779a650bd9e6c9a6d2be811f8e93"
          python3 scripts/wrap_parity_cube_3mf.py \
            --stl native-cli-output/parity-cube.stl \
            --output native-cli-output/parity-cube-positioned.3mf
          python3 scripts/audit_3mf_scene.py \
            --input native-cli-output/parity-cube-positioned.3mf \
            --expected-build-items 1 --min-triangles 12 \
            --report native-cli-output/native-parity-cube-scene.json
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          # Verify the native engine's actual exported geometry, not only
          # the declared 3MF transform. Abort if any auto-centering occurs.
          mkdir -p native-cli-output/native-parity-cube-export
          timeout 120s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/parity-cube-positioned.3mf \
            --arrange 0 --export-stl --outputdir native-cli-output/native-parity-cube-export \
            > native-cli-output/native-parity-cube-export.log 2>&1 || {
              tail -n 100 native-cli-output/native-parity-cube-export.log
              exit 1
            }
          python3 - <<'PY' | tee native-cli-output/native-parity-cube-geometry.log
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from verify_native_exported_stl import read_triangles
          paths = list(Path('native-cli-output/native-parity-cube-export').rglob('*.stl'))
          if len(paths) != 1:
              raise SystemExit(f'Expected exactly one native exported STL: {paths}')
          faces = read_triangles(paths[0])
          if len(faces) != 12:
              raise SystemExit(f'Unexpected triangle count: {len(faces)}')
          points = [p for face in faces for p in face]
          bounds = [(min(p[i] for p in points), max(p[i] for p in points)) for i in range(3)]
          target = [(128,148),(128,148),(0,20)]
          if any(abs(v-expect) > 0.001 for pair, expected in zip(bounds,target)
                 for v, expect in zip(pair,expected)):
              raise SystemExit(f'Native export ignored the explicit shared placement: {bounds}')
          print('PASS: native v2.5.0 exported one 12-triangle cube at XYZ bounds',bounds)
          print('Placement input geometry matches isolated WASM manifest 128,128,0')
          print('Profiles, CLI import format and actual G-code remain unpaired')
          PY
          # Independent STL-facet witness: the native exported geometry must
          # agree with every placed source triangle, not merely with its AABB.
          python3 scripts/audit_native_parity_cube_geometry.py \
            --source native-cli-output/parity-cube.stl \
            --export-dir native-cli-output/native-parity-cube-export \
            --report native-cli-output/native-parity-cube-faces.json
          grep -q '"passed": true' native-cli-output/native-parity-cube-faces.json
          grep -q '"parity_pass": false' native-cli-output/native-parity-cube-faces.json
          mkdir -p native-cli-output/native-parity-cube-gcode
          timeout 240s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/parity-cube-positioned.3mf \
            --load-settings "native-cli-output/native-profiles/process.json;native-cli-output/native-profiles/machine.json" \
            --load-filaments native-cli-output/native-profiles/filament.json \
            --arrange 0 --slice 0 --outputdir native-cli-output/native-parity-cube-gcode \
            > native-cli-output/native-parity-cube-slice.log 2>&1 || {
              tail -n 140 native-cli-output/native-parity-cube-slice.log
              exit 1
            }
          test -s native-cli-output/native-parity-cube-gcode/plate_1.gcode
          python3 - <<'PY' | tee native-cli-output/native-parity-cube-metrics.log
          import hashlib
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from compare_gcode import canonical, count_motion, count_extrusion_moves
          source = Path('native-cli-output/parity-cube.stl')
          output = Path('native-cli-output/native-parity-cube-gcode/plate_1.gcode')
          source_sha = hashlib.sha256(source.read_bytes()).hexdigest()
          if source_sha != '7b59223183b5c34815cbf197e1207b108932779a650bd9e6c9a6d2be811f8e93':
              raise SystemExit('Shared STL source digest mismatch')
          if not 1024 <= output.stat().st_size <= 20_000_000:
              raise SystemExit('Native source-cube G-code is empty or oversized')
          commands = canonical(output)
          motion, extrusions = count_motion(commands), count_extrusion_moves(commands)
          if motion < 100 or extrusions < 100:
              raise SystemExit('Official native source-cube slicing lacks deposited paths')
          print('PASS: official native v2.5.0 sliced source-pinned cube at explicit placement')
          print('source_stl_sha256:', source_sha)
          print('native_gcode_sha256:', hashlib.sha256(output.read_bytes()).hexdigest())
          print('native_gcode_commands:', len(commands))
          print('native_gcode_motion:', motion)
          print('native_gcode_extrusions:', extrusions)
          print('comparison_status: NOT PAIRED (full profiles and native input container differ)')
          PY
          sha256sum native-cli-output/native-parity-cube-gcode/plate_1.gcode \
            > native-cli-output/native-parity-cube-gcode.sha256
          # G-code and licensed full profiles remain ephemeral; only geometry
          # metrics, scene audit, hashes and text logs enter CI artifacts.

      - name: Verify previous Chrome fixture artifact is still available
        id: browser_pair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Read-only, pinned prior success. Archive expires after 14 days.
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/44032175782/artifacts \
            > "$RUNNER_TEMP/browser-artifacts.json"
          if python3 -c '
          import json,sys
          a=json.load(open(sys.argv[1]))["artifacts"]
          matches=[x for x in a if x["name"]=="layer-workbench-wasm-gcode-diagnostic"]
          assert len(matches)==1
          x=matches[0]
          assert x["workflow_run"]["head_sha"]=="4f33ce570108bb8bd90c4f5a2e8eadba000d11d2"
          sys.exit(0 if not x["expired"] else 1)
          ' "$RUNNER_TEMP/browser-artifacts.json"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: historical Chrome G-code archive expired; no paired comparison."
          fi

      - name: Download historical real browser-WASM cube G-code (diagnostics only)
        if: steps.browser_pair.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: layer-workbench-wasm-gcode-diagnostic
          repository: temesotejam/layer-workbench
          run-id: 44032175782
          github-token: ${{ github.token }}
          path: native-cli-output/wasm-baseline

      - name: Compare actual aligned-source native and WASM G-code numerically
        if: steps.browser_pair.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # G-code on both sides, same 684-byte source cube; native Core
          # 3MF wrapper/full profiles and WASM generic PLA are NOT equivalent.
          python3 scripts/diagnose_live_cube_pair.py \
            --source-stl native-cli-output/parity-cube.stl \
            --native native-cli-output/native-parity-cube-gcode/plate_1.gcode \
            --wasm native-cli-output/wasm-baseline/wasm.gcode \
            --wasm-summary native-cli-output/wasm-baseline/wasm-gcode-summary.json \
            --min-extrusion-moves 100 \
            --report native-cli-output/native-wasm-shared-cube-diagnostic.log
          grep -q '"parity_pass": false' native-cli-output/native-wasm-shared-cube-diagnostic.log
          echo "PASS: real native/WASM G-code differences quantified; parity NOT ESTABLISHED"

      - name: Verify repeated native full-profile slice has stable ordered G-code commands
        shell: bash
        run: |
          set -euo pipefail
          # Same official executable, synthetic Core 3MF, fully resolved
          # source-pinned profiles and arrangement setting as baseline.
          # Keep the generated G-code and licensed profile data ephemeral.
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          mkdir -p native-cli-output/native-gcode-repeat
          timeout 240s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/two-build-items.3mf \
            --load-settings "native-cli-output/native-profiles/process.json;native-cli-output/native-profiles/machine.json" \
            --load-filaments native-cli-output/native-profiles/filament.json \
            --arrange 0 --slice 0 --outputdir native-cli-output/native-gcode-repeat \
            > native-cli-output/native-repeat-slice.log 2>&1 || {
              tail -n 140 native-cli-output/native-repeat-slice.log
              exit 1
            }
          test -s native-cli-output/native-gcode-repeat/plate_1.gcode
          python3 scripts/verify_native_gcode_repeatability.py \
            --first native-cli-output/native-gcode/plate_1.gcode \
            --repeat native-cli-output/native-gcode-repeat/plate_1.gcode \
            --minimum-extrusion 100 \
            --report native-cli-output/native-command-repeatability.log
          sha256sum native-cli-output/native-gcode-repeat/plate_1.gcode \
            > native-cli-output/native-gcode-repeat.sha256
          # PASS is only native command repeatability, NOT native/WASM equality.

      - name: Prove effective native process layer height changes actual extruded Z steps
        shell: bash
        run: |
          set -euo pipefail
          # Alter only layer height in a private copy of pinned resolved process.
          # No upstream JSON files or generated G-code are deployed.
          python3 - <<'PY'
          import json
          from pathlib import Path
          src = Path("native-cli-output/native-profiles/process.json")
          profile = json.loads(src.read_text(encoding="utf-8"))
          if str(profile.get("layer_height")) != "0.2":
              raise SystemExit("unexpected pinned native process layer_height")
          profile["layer_height"] = "0.25"
          dst = Path("native-cli-output/native-profiles/process-025.json")
          dst.write_text(json.dumps(profile, indent=2) + "\n", encoding="utf-8")
          dst.chmod(0o600)
          PY
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          mkdir -p native-cli-output/native-gcode-layer-025
          timeout 240s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/two-build-items.3mf \
            --load-settings "native-cli-output/native-profiles/process-025.json;native-cli-output/native-profiles/machine.json" \
            --load-filaments native-cli-output/native-profiles/filament.json \
            --arrange 0 --slice 0 --outputdir native-cli-output/native-gcode-layer-025 \
            > native-cli-output/native-layer-height-slice.log 2>&1 || {
              tail -n 140 native-cli-output/native-layer-height-slice.log
              exit 1
            }
          test -s native-cli-output/native-gcode-layer-025/plate_1.gcode
          python3 scripts/verify_native_layer_height.py \
            --baseline native-cli-output/native-gcode/plate_1.gcode \
            --altered native-cli-output/native-gcode-layer-025/plate_1.gcode \
            --report native-cli-output/native-layer-height-audit.log
          sha256sum native-cli-output/native-gcode-layer-025/plate_1.gcode \
            > native-cli-output/native-gcode-layer-025.sha256
          # An observed native setting effect does not prove WASM parity or print safety.

      - name: Prove effective native initial nozzle temperature changes actual heater commands
        shell: bash
        run: |
          set -euo pipefail
          # Create an ephemeral one-field change to the inherited official
          # filament vector. Never upload the full licensed preset or G-code.
          python3 - <<'PY'
          import json
          from pathlib import Path
          src = Path("native-cli-output/native-profiles/filament.json")
          filament = json.loads(src.read_text(encoding="utf-8"))
          if filament.get("nozzle_temperature_initial_layer") != ["220"]:
              raise SystemExit("unexpected pinned native initial nozzle temperature vector")
          filament["nozzle_temperature_initial_layer"] = ["235"]
          dst = Path("native-cli-output/native-profiles/filament-nozzle-235.json")
          dst.write_text(json.dumps(filament, indent=2) + "\n", encoding="utf-8")
          dst.chmod(0o600)
          PY
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          mkdir -p native-cli-output/native-gcode-nozzle-235
          timeout 240s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/two-build-items.3mf \
            --load-settings "native-cli-output/native-profiles/process.json;native-cli-output/native-profiles/machine.json" \
            --load-filaments native-cli-output/native-profiles/filament-nozzle-235.json \
            --arrange 0 --slice 0 --outputdir native-cli-output/native-gcode-nozzle-235 \
            > native-cli-output/native-nozzle-temp-slice.log 2>&1 || {
              tail -n 140 native-cli-output/native-nozzle-temp-slice.log
              exit 1
            }
          test -s native-cli-output/native-gcode-nozzle-235/plate_1.gcode
          python3 scripts/verify_native_nozzle_temperature.py \
            --baseline native-cli-output/native-gcode/plate_1.gcode \
            --altered native-cli-output/native-gcode-nozzle-235/plate_1.gcode \
            --report native-cli-output/native-nozzle-temp-audit.log
          sha256sum native-cli-output/native-gcode-nozzle-235/plate_1.gcode \
            > native-cli-output/native-gcode-nozzle-235.sha256
          # Actual M104/M109 targets are not thermistor measurements or print safety.

      - name: Prove native outer-wall speed changes real tagged deposition feed commands
        shell: bash
        run: |
          set -euo pipefail
          # Private one-field change to the full source-pinned process profile.
          # This fixture is NOT a machine-safe printer configuration.
          python3 - <<'PY'
          import json
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          src = Path("native-cli-output/native-profiles/process.json")
          profile = json.loads(src.read_text(encoding="utf-8"))
          try:
              original = Decimal(str(profile["outer_wall_speed"]))
          except (KeyError, ValueError, InvalidOperation) as exc:
              raise SystemExit("pinned process has no scalar outer_wall_speed") from exc
          if not original.is_finite() or original <= 2 or original > 500:
              raise SystemExit(f"unexpected source-pinned outer_wall_speed: {original}")
          profile["outer_wall_speed"] = "2"
          dst = Path("native-cli-output/native-profiles/process-outer-wall-2.json")
          dst.write_text(json.dumps(profile, indent=2) + "\n", encoding="utf-8")
          dst.chmod(0o600)
          print("Baseline official process outer_wall_speed (mm/s):", original)
          PY
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          mkdir -p native-cli-output/native-gcode-outer-wall-2
          timeout 240s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/two-build-items.3mf \
            --load-settings "native-cli-output/native-profiles/process-outer-wall-2.json;native-cli-output/native-profiles/machine.json" \
            --load-filaments native-cli-output/native-profiles/filament.json \
            --arrange 0 --slice 0 --outputdir native-cli-output/native-gcode-outer-wall-2 \
            > native-cli-output/native-outer-wall-slice.log 2>&1 || {
              tail -n 140 native-cli-output/native-outer-wall-slice.log
              exit 1
            }
          test -s native-cli-output/native-gcode-outer-wall-2/plate_1.gcode
          python3 scripts/verify_native_outer_wall_speed.py \
            --baseline native-cli-output/native-gcode/plate_1.gcode \
            --altered native-cli-output/native-gcode-outer-wall-2/plate_1.gcode \
            --report native-cli-output/native-outer-wall-speed-audit.log
          sha256sum native-cli-output/native-gcode-outer-wall-2/plate_1.gcode \
            > native-cli-output/native-gcode-outer-wall-2.sha256
          # Measured G-code F targets do not prove physical speed or WASM parity.

      - name: Verify same-geometry native bridge arch feedrate response (diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-export-bridge-arch-stl.mjs
          python3 -m unittest discover -s scripts -p test_verify_native_bridge_speed.py -v
          node scripts/export-bridge-arch-stl.mjs native-cli-output/bridge-arch.stl
          python3 -m unittest discover -s scripts -p test_wrap_bridge_arch_3mf.py -v
          python3 scripts/wrap_bridge_arch_3mf.py --stl native-cli-output/bridge-arch.stl \
            --output native-cli-output/bridge-arch.3mf
          sha256sum native-cli-output/bridge-arch.stl > native-cli-output/native-bridge-arch.sha256
          # The only altered value is process.bridge_speed; all other official
          # machine/filament/process options are unchanged and ephemeral.
          python3 - <<'PY'
          import json
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          path=Path("native-cli-output/native-profiles/process.json")
          process=json.loads(path.read_text(encoding="utf-8"))
          try:
              value=Decimal(str(process["bridge_speed"]))
          except (KeyError, ValueError, InvalidOperation) as exc:
              raise SystemExit("Pinned official bridge speed is missing or nonnumeric") from exc
          if not value.is_finite() or not 2 < value <= 500:
              raise SystemExit(f"Unexpected official bridge_speed: {value}")
          process["bridge_speed"]="2"
          target=Path("native-cli-output/native-profiles/process-bridge-2.json")
          target.write_text(json.dumps(process,indent=2)+"\n",encoding="utf-8")
          target.chmod(0o600)
          print("Original pinned native bridge_speed mm/s:",value)
          PY
          app="$RUNNER_TEMP/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          mkdir -p native-cli-output/native-bridge-baseline native-cli-output/native-bridge-2
          timeout 240s env APPIMAGE_EXTRACT_AND_RUN=1 "$app" \
            native-cli-output/bridge-arch.3mf \
            --load-settings "native-cli-output/native-profiles/process.json;native-cli-output/native-profiles/machine.json" \
            --load-filaments native-cli-output/native-profiles/filament.json \
            --arrange 0 --slice 0 --outputdir native-cli-output/native-bridge-baseline \
            > native-cli-output/native-bridge-baseline.log 2>&1 || {
              tail -n 140 native-cli-output/native-bridge-baseline.log
              exit 1
            }
          timeout 240s env APPIMAGE_EXTRACT_AND_RUN=1 "$app" \
            native-cli-output/bridge-arch.3mf \
            --load-settings "native-cli-output/native-profiles/process-bridge-2.json;native-cli-output/native-profiles/machine.json" \
            --load-filaments native-cli-output/native-profiles/filament.json \
            --arrange 0 --slice 0 --outputdir native-cli-output/native-bridge-2 \
            > native-cli-output/native-bridge-2.log 2>&1 || {
              tail -n 140 native-cli-output/native-bridge-2.log
              exit 1
            }
          test -s native-cli-output/native-bridge-baseline/plate_1.gcode
          test -s native-cli-output/native-bridge-2/plate_1.gcode
          python3 scripts/verify_native_bridge_speed.py \
            --baseline native-cli-output/native-bridge-baseline/plate_1.gcode \
            --altered native-cli-output/native-bridge-2/plate_1.gcode \
            --report native-cli-output/native-bridge-speed-audit.log
          # No generated print G-code or full licensed upstream profiles archived.

      - name: Archive text diagnostics without redistributing the AppImage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcaslicer-v250-official-native-cli-diagnostics
          path: |
            native-cli-output/*.log
            native-cli-output/*.sha256
            native-cli-output/appimage-format.txt
          if-no-files-found: warn
          retention-days: 7
