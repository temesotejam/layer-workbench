            native-cli-output/shared-root-private.3mf --arrange 0 --export-stl \
            --outputdir native-cli-output/shared-root-private-stl \
            > native-cli-output/shared-root-native-reopen.log 2>&1 || {
              tail -n 120 native-cli-output/shared-root-native-reopen.log
              exit 1
            }
          mapfile -d '' stls < <(find native-cli-output/shared-root-private-stl \
            -type f -iname '*.stl' -print0)
          if [ "${#stls[@]}" -lt 1 ] || [ "${#stls[@]}" -gt 2 ]; then
            echo "Unexpected official native STL count: ${#stls[@]}"
            exit 1
          fi
          python3 scripts/audit_native_3mf_instance_placement.py \
            --input native-cli-output/shared-root-private.3mf \
            --require-instances 2 --verify-stls "${stls[@]}" \
            --report native-cli-output/shared-root-native-stl-audit.log
          echo "PASS: official native CLI reloaded two-level isolated Core fixture"

      - name: Verify private Y mesh edit after shared-root COW with native CLI
        shell: bash
        run: |
          set -euo pipefail
          # Same official CLI-authored project used by the preceding COW gate.
