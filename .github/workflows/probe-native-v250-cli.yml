          python3 scripts/scale_native_3mf_private_leaf.py \
            --input native-cli-output/shared-root-private.3mf \
            --output native-cli-output/shared-root-scaled-y.3mf \
            --build-index 1 --component-edge 0 --scale-y 1.2 \
