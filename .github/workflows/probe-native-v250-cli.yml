          if [ "${#stls[@]}" -lt 1 ] || [ "${#stls[@]}" -gt 2 ]; then
            echo "Expected 1..2 STL exports from rotated native 3MF"
            exit 1
          fi
          # The native CLI may serialize centered external parts, so the
          # main build item's rotation pivot is NOT presumed to be (90,90).
          # Compute the expected 45-degree world-space XY AABB from the
          # original 90..110 mm fixture and the actual native Core transform.
          mapfile -t rotated_bounds < <(python3 - <<'PY'
          import math
          from zipfile import ZipFile
          import sys
          sys.path.insert(0, "scripts")
          from compare_3mf_build_preservation import IDENTITY, mask_build_transforms
          from audit_3mf_scene import parse_model_unit
          from verify_native_3mf_package import safe_xml, MAIN_PART
          with ZipFile("native-cli-output/native-v250-project.3mf") as z:
              data = z.read(MAIN_PART)
          _, matrices = mask_build_transforms(data)
          unit = safe_xml(data, MAIN_PART).get("unit")
          _, mm_per_unit = parse_model_unit(unit)
          matrix = matrices[0] if matrices[0] is not None else IDENTITY
          px, py = (matrix[9] * mm_per_unit, matrix[10] * mm_per_unit)
          angle = math.radians(45)
          c, s = math.cos(angle), math.sin(angle)
          corners = [(x, y) for x in (90,110) for y in (90,110)]
          rotated = [(px + (x-px)*c - (y-py)*s,
                      py + (x-px)*s + (y-py)*c) for x,y in corners]
          bounds = [min(x for x,y in rotated), max(x for x,y in rotated),
                    min(y for x,y in rotated), max(y for x,y in rotated)]
          if abs(bounds[1]-bounds[0]-20) < 0.01:
              raise SystemExit("The 45-degree rotation must change the cube's AABB")
          for value in bounds:
              print(f"{value:.6f}")
          print(f"Native main build rotation pivot: ({px:.5f}, {py:.5f})",
                file=sys.stderr)
          PY
