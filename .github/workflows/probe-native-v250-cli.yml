permissions:
  contents: read
  actions: read

jobs:
  native-cli-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit-test shared source STL to explicit Core 3MF conversion offline
        run: python3 -m unittest discover -s scripts -p test_wrap_parity_cube_3mf.py -v

      - name: Unit-test native shared-cube face-level geometry gate offline
        run: python3 -m unittest discover -s scripts -p test_audit_native_parity_cube_geometry.py -v

      - name: Unit-test fail-closed G-code paired diagnostic offline
        run: python3 -m unittest discover -s scripts -p test_diagnose_live_cube_pair.py -v

      - name: Unit-test the STL placement audit offline
        run: python3 -m unittest discover -s scripts -p test_verify_native_exported_stl.py -v

      - name: Unit-test native 3MF external-part package validation offline
        run: python3 -m unittest discover -s scripts -p test_verify_native_3mf_package.py -v

      - name: Unit-test native 3MF component and build reference inventory offline
        run: python3 -m unittest discover -s scripts -p test_inspect_native_3mf_hierarchy.py -v

      - name: Unit-test native 3MF multipart world placement composition offline
        run: python3 -m unittest discover -s scripts -p test_audit_native_3mf_instance_placement.py -v

      - name: Unit-test native 3MF shared Core ownership preflight offline
        run: python3 -m unittest discover -s scripts -p test_audit_native_3mf_edit_ownership.py -v

      - name: Unit-test occurrence-specific native 3MF clone-chain planner offline
        run: python3 -m unittest discover -s scripts -p test_plan_native_3mf_copy_on_write.py -v

      - name: Unit-test native 3MF shared Core leaf clone writer offline
        run: python3 -m unittest discover -s scripts -p test_clone_native_3mf_shared_leaf.py -v

      - name: Unit-test two-level shared-root Core copy-on-write offline
        run: python3 -m unittest discover -s scripts -p test_clone_native_3mf_shared_root_chain.py -v

      - name: Unit-test three-level shared Core path copy-on-write offline
        run: python3 -m unittest discover -s scripts -p test_clone_native_3mf_three_level_chain.py -v

      - name: Unit-test one private Core mesh vertex edit offline
        run: python3 -m unittest discover -s scripts -p test_scale_native_3mf_private_leaf.py -v

      - name: Unit-test expanded native 3MF instance edit effects offline
        run: python3 -m unittest discover -s scripts -p test_verify_native_3mf_edit_effect.py -v

      - name: Unit-test isolated native 3MF Core rotation/scale effects offline
        run: python3 -m unittest discover -s scripts -p test_verify_native_3mf_linear_edit_effect.py -v

      - name: Unit-test lossless native multi-part build edit offline
        run: python3 -m unittest discover -s scripts -p test_edit_native_3mf_build_transform.py -v

      - name: Unit-test native effective layer-height audit offline
        run: python3 -m unittest discover -s scripts -p test_verify_native_layer_height.py -v

      - name: Unit-test native nozzle-heater command audit offline
        run: python3 -m unittest discover -s scripts -p test_verify_native_nozzle_temperature.py -v

      - name: Unit-test native outer-wall deposition speed audit offline
        run: python3 -m unittest discover -s scripts -p test_verify_native_outer_wall_speed.py -v

      - name: Unit-test shared first-layer F and deposited-E comparison offline
        run: node scripts/test-initial-layer-travel-diagnostic.mjs

      - name: Unit-test native first-layer travel F diagnostic offline
        run: node scripts/test-verify-native-initial-layer-travel.mjs

      - name: Unit-test native ordered-command repeatability audit offline
        run: python3 -m unittest discover -s scripts -p test_verify_native_gcode_repeatability.py -v

      - name: Download the official v2.5.0 Linux AppImage only inside CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-cli-output
          asset="OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          url="https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.5.0/${asset}"
          curl --fail --location --show-error --silent --retry 3 \
            --retry-all-errors --max-time 360 --max-filesize 800000000 \
            "${url}" -o "${RUNNER_TEMP}/${asset}"
          test "$(wc -c < "${RUNNER_TEMP}/${asset}")" -gt 50000000
          file "${RUNNER_TEMP}/${asset}" | tee native-cli-output/appimage-format.txt
          grep -q 'ELF' native-cli-output/appimage-format.txt
          sha256sum "${RUNNER_TEMP}/${asset}" | tee native-cli-output/official-v250-appimage.sha256
          # Observed on the official release asset in two independent PR CI downloads.
          actual="$(sha256sum "${RUNNER_TEMP}/${asset}" | cut -d ' ' -f1)"
          test "${actual}" = "d13eb0a9cd618ed080ab6b82c64c0a60c4501aac91e88d5ac2c3b526fb141a7c"
          chmod +x "${RUNNER_TEMP}/${asset}"

      - name: Install the host libraries required by the official AppImage
        shell: bash
        run: |
          set -euo pipefail
          # Hosted runners sometimes select a very slow regional EC2
          # Ubuntu mirror; the last two PR probes reached the job timeout
          # while downloading ordinary dependencies. Change only that mirror
          # on this ephemeral runner, retaining Ubuntu's signed repositories
          # and its separate security source.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "${source}" ] && grep -Eq '([a-z0-9-]+\.)?ec2\.archive\.ubuntu\.com' "${source}"; then
              sudo sed -i -E 's@https?://[a-z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu@http://archive.ubuntu.com/ubuntu@g' "${source}"
              echo "Switched regional EC2 archive mirror to standard Ubuntu archive in ${source}"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            libopengl0 libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 libglu1-mesa

      - name: Exercise official native headless help and independent Core 3MF import
        shell: bash
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          python3 scripts/make_3mf_two_build_fixture.py \
            --output native-cli-output/two-build-items.3mf
          # Extract-and-run avoids the runner's FUSE device dependency.
          # No print commands, printer networking, or G-code export are invoked.
          timeout 120s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" --help \
            > native-cli-output/native-help.log 2>&1 || {
              cat native-cli-output/native-help.log
              exit 1
            }
          test -s native-cli-output/native-help.log
          grep -Fq "OrcaSlicer-2.5.0" native-cli-output/native-help.log
          grep -Fq -- "--slice" native-cli-output/native-help.log
          grep -Fq -- "--load-settings" native-cli-output/native-help.log
          grep -Fq -- "--load-filaments" native-cli-output/native-help.log
          timeout 120s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/two-build-items.3mf --info \
            > native-cli-output/native-info.log 2>&1 || {
              cat native-cli-output/native-info.log
              exit 1
            }
          test -s native-cli-output/native-info.log
          # The official CLI's --info lists two Core 3MF build items.
          # This does not certify their native plate transforms.
          python3 - <<'PY'
          import re
          from pathlib import Path
          info = Path("native-cli-output/native-info.log").read_text(encoding="utf-8")
          headers = re.findall(r"(?m)^\[two-build-items\.3mf\]$", info)
          facets = re.findall(r"(?m)^number_of_facets\s*=\s*(\d+)$", info)
          manifolds = re.findall(r"(?m)^manifold\s*=\s*(\w+)$", info)
          sizes = re.findall(r"(?m)^size_x\s*=\s*([0-9.]+)$", info)
          if not (len(headers) == 2 and facets == ["12", "12"]
                  and manifolds == ["yes", "yes"]
                  and len(sizes) == 2 and all(abs(float(s) - 20) < 1e-5 for s in sizes)):
              raise SystemExit("Native v2.5.0 --info did not identify both manifold 20 mm Core 3MF cubes")
          print("PASS: official v2.5.0 native --info recognized two manifold 12-facet 20mm cubes")
          PY
          echo "PASS: official v2.5.0 CLI --help and synthetic Core 3MF --info"
          # The headless test only proves CLI startup and model inspection.
          # It is not a native G-code result, full-profile comparison or 3MF round-trip.

      - name: Check native Core 3MF export placement with real geometry
        shell: bash
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          mkdir -p native-cli-output/stl-export
          # Preserve explicit Core 3MF placements; default CLI auto-arrange
          # moved the cubes from (90,90)/(150,90) to adjacent Y positions.
          timeout 120s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/two-build-items.3mf \
            --arrange 0 --export-stl --outputdir native-cli-output/stl-export \
            > native-cli-output/native-export-stl.log 2>&1 || {
              cat native-cli-output/native-export-stl.log
              exit 1
            }
          mapfile -d '' stls < <(find native-cli-output -type f -iname '*.stl' -print0)
          printf "STL export files (count=%s):\n" "${#stls[@]}"
          printf "  %s\n" "${stls[@]}"
          if [ "${#stls[@]}" -lt 1 ] || [ "${#stls[@]}" -gt 2 ]; then
            cat native-cli-output/native-export-stl.log
            echo "Expected one combined or two per-item native STL files, got ${#stls[@]}"
            exit 1
          fi
          python3 scripts/verify_native_exported_stl.py "${stls[@]}" \
            | tee native-cli-output/native-stl-geometry.log
          sha256sum "${stls[@]}" | tee native-cli-output/native-stl.sha256
          echo "PASS: official native v2.5.0 preserved both synthetic Core 3MF build placements"

      - name: Verify a surgically translated Core 3MF in the official native v2.5.0 CLI
        shell: bash
        run: |
          set -euo pipefail
          # Use the same original source from the baseline native export.
          # Move ONLY the first build item +10 mm X; never rewrite the mesh.
          python3 scripts/edit_3mf_build_transform.py \
            --input native-cli-output/two-build-items.3mf \
            --output native-cli-output/two-build-items-edited.3mf \
            --build-index 0 --translate-mm 10 0 0
          python3 scripts/compare_3mf_build_preservation.py \
            --baseline native-cli-output/two-build-items.3mf \
            --candidate native-cli-output/two-build-items-edited.3mf \
            --report native-cli-output/edited-core-preservation.json
          # A passing byte-preservation audit alone says nothing about whether
          # OrcaSlicer actually applied the edited placement. Export real STL
          # from the official pinned native AppImage and audit both boxes.
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          mkdir -p native-cli-output/edited-stl-export
          timeout 120s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/two-build-items-edited.3mf \
            --arrange 0 --export-stl --outputdir native-cli-output/edited-stl-export \
            > native-cli-output/native-edited-export-stl.log 2>&1 || {
              tail -n 100 native-cli-output/native-edited-export-stl.log
              exit 1
            }
          mapfile -d '' edited_stls < <(find native-cli-output/edited-stl-export \
            -type f -iname '*.stl' -print0)
          if [ "${#edited_stls[@]}" -lt 1 ] || [ "${#edited_stls[@]}" -gt 2 ]; then
            echo "Expected 1..2 edited native STL exports, got ${#edited_stls[@]}"
            exit 1
          fi
          python3 scripts/verify_native_exported_stl.py \
            --expected-bounds 100 120 90 110 0 20 150 170 90 110 0 20 \
            "${edited_stls[@]}" | tee native-cli-output/native-edited-placement-audit.log
          echo "PASS: official native v2.5.0 applied the edited first-item Core placement"
          # Synthetic Core 3MF interoperability only. No native-generated
          # Orca project metadata, source preservation or print safety proven.

      - name: Prepare pinned full native v2.5.0 machine, process and filament presets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-prepare-native-v250-presets.mjs
          # Upstream JSON stays ephemeral on the runner. Source revision is
          # pinned in the fetcher and asserted again during materialization.
          python3 scripts/fetch-upstream-v250-fixture.py
          node scripts/prepare-native-v250-presets.mjs \
            upstream-v250-creality-fixture.json upstream-v250-filament-fixture.json \
            native-cli-output/native-profiles
          # Preserve only the provenance and digest manifest in CI artifacts.
          cp native-cli-output/native-profiles/manifest.json native-cli-output/native-profiles-manifest.log

      - name: Reopen an official-native-exported v2.5.0 3MF and verify geometry
        shell: bash
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          project="${PWD}/native-cli-output/native-v250-project.3mf"
          # Unlike the hand-authored Core input, this output is serialized
          # by the official v2.5.0 CLI with the exact pinned full presets.
          # The file stays inside the disposable CI runner.
          timeout 180s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/two-build-items.3mf \
            --load-settings "native-cli-output/native-profiles/process.json;native-cli-output/native-profiles/machine.json" \
            --load-filaments native-cli-output/native-profiles/filament.json \
            --arrange 0 --export-3mf "${project}" \
            > native-cli-output/native-project-export.log 2>&1 || {
              tail -n 120 native-cli-output/native-project-export.log
              exit 1
            }
          test -s "${project}" || {
            tail -n 120 native-cli-output/native-project-export.log
            echo "Official CLI produced no native 3MF project"
            exit 1
          }
          # Inventory is bounded against unsafe members. Record only paths,
          # sizes and hashes; do not upload native project or preset payloads.
          python3 - <<'PY' | tee native-cli-output/native-project-members.log
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from compare_3mf_metadata import inventory
          members = inventory(Path("native-cli-output/native-v250-project.3mf"))
          models = [name for name in members if name.startswith("3D/") and name.lower().endswith(".model")]
          summary = {
              "native_export": True,
              "archive_member_count": len(members),
              "model_parts": models,
              "paths": sorted(members),
              "note": "Archive inventory only; profiles and project semantics are not certified."
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          # Native Orca projects use cross-part object references, which the
          # restricted synthetic Core scene parser deliberately rejects.
          # Verify this pinned layout's OPC member references separately,
          # then rely on the real native STL reimport for placed geometry.
          python3 scripts/verify_native_3mf_package.py \
            --input "${project}" \
            --report native-cli-output/native-project-package.log
          # Read-only structural topology report for the pinned multipart fixture.
          # Keep topology distinct from proved geometry and metadata semantics.
          python3 scripts/inspect_native_3mf_hierarchy.py \
            --input "${project}" --require-build-items 2 \
            --report native-cli-output/native-project-hierarchy.log
          cat native-cli-output/native-project-hierarchy.log
          # Distinguish independently placed Core roots from a shared leaf
          # resource; editing the leaf in place would affect both instances.
          # No project contents are modified by this preflight.
          python3 scripts/audit_native_3mf_edit_ownership.py \
            --input "${project}" --require-shared-mesh \
            --require-independent-roots \
            --report native-cli-output/native-project-edit-ownership.log
          cat native-cli-output/native-project-edit-ownership.log
          # Select the second real native build instance and its first
          # component edge. Plan only; never modify a native project here.
          python3 scripts/plan_native_3mf_copy_on_write.py \
            --input "${project}" --build-index 1 --component-edges 0 \
            --require-copy \
            --report native-cli-output/native-project-cow-plan.log
          cat native-cli-output/native-project-cow-plan.log
          # One conservative edit: clone the second occurrence's shared
          # external Core mesh and retarget only its independent parent edge.
          # No mesh vertex changes, no profiles edited, no print commands.
          python3 scripts/clone_native_3mf_shared_leaf.py \
            --input "${project}" --output native-cli-output/native-cow-private.3mf \
            --build-index 1 --component-edge 0 \
            --report native-cli-output/native-cow-private-audit.log
          cat native-cli-output/native-cow-private-audit.log
          mkdir -p native-cli-output/native-cow-private-stl
          timeout 180s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/native-cow-private.3mf --arrange 0 --export-stl \
