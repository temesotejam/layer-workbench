          echo "PASS: native CLI reopened private Y-scaled shared-root 3MF; sibling preserved"

      - name: Exercise native v2.5.0 on an independently nested three-level Core 3MF
        shell: bash
        run: |
          set -euo pipefail
          # Start with official CLI-exported bytes, not the synthetic test
          # archive, so unchanged native opaque config and OPC parts survive.
          python3 - <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile
          sys.path.insert(0, "scripts")
          from clone_native_3mf_shared_leaf import (
              COMPONENT_OPEN, RESOURCES_END, _guard_xml, _object_block)
          from plan_native_3mf_copy_on_write import plan_copy_on_write
          from audit_native_3mf_instance_placement import inspect_placements
          from verify_native_3mf_package import CORE_NS, MAIN_PART
          source = Path("native-cli-output/shared-root-source.3mf")
          output = Path("native-cli-output/three-level-source.3mf")
          with ZipFile(source) as archive:
              raw = archive.read(MAIN_PART)
              tree = _guard_xml(raw, "official native three-level source")
              resources = tree.find(CORE_NS + "resources")
              items = tree.find(CORE_NS + "build").findall(CORE_NS + "item")
              if len(items) != 2 or items[0].get("objectid") != items[1].get("objectid"):
                  raise SystemExit("Shared native Core root is required")
              rid = items[0].get("objectid")
              ids = [int(o.get("id")) for o in resources.findall(CORE_NS + "object")]
              middle_id = str(max(ids) + 1)
              root_start, _, root_end = _object_block(raw, rid)
              block = raw[root_start:root_end]
              edges = list(COMPONENT_OPEN.finditer(block))
              if len(edges) != 1:
                  raise SystemExit("Exactly one native Core root edge is required")
              old_edge = edges[0].group()
              # Production Extension location belongs to the INNER edge only.
              # The new outer edge has identity transform and same-part target.
              if b"p:path=" not in old_edge or not old_edge.endswith(b"/>"):
                  raise SystemExit("Unsupported native external component markup")
              new_edge = b'<component objectid="' + middle_id.encode() + b'"/>'
              replacement = block[:edges[0].start()] + new_edge + block[edges[0].end():]
              changed_root = raw[:root_start] + replacement + raw[root_end:]
              new_middle = (b'<object id="' + middle_id.encode() +
                            b'" type="model"><components>' + old_edge +
                            b'</components></object>')
              endings = list(RESOURCES_END.finditer(changed_root))
              if len(endings) != 1:
                  raise SystemExit("Invalid Core resources boundary")
              at = endings[0].start()
              changed = changed_root[:at] + b"\n" + new_middle + b"\n" + changed_root[at:]
              with ZipFile(output, "x") as result:
                  result.comment = archive.comment
                  for info in archive.infolist():
                      result.writestr(info, changed if info.filename == MAIN_PART
                                      else archive.read(info))
          if len(plan_copy_on_write(output, 1, [0, 0])["clone_steps_inner_to_outer"]) != 3:
              raise SystemExit("Nested official project does not need exactly three clones")
          if (inspect_placements(source)["per_build_world_bounds_mm"] !=
                  inspect_placements(output)["per_build_world_bounds_mm"]):
              raise SystemExit("Inserting identity middle changed source geometry")
          print("PASS: real native 3MF metadata retained while inserting one middle Core level")
          PY
          python3 scripts/clone_native_3mf_three_level_chain.py \
            --input native-cli-output/three-level-source.3mf \
            --output native-cli-output/three-level-private.3mf \
            --report native-cli-output/three-level-cow-audit.log
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          mkdir -p native-cli-output/three-level-private-stl
          timeout 180s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/three-level-private.3mf --arrange 0 --export-stl \
            --outputdir native-cli-output/three-level-private-stl \
            > native-cli-output/three-level-native-reopen.log 2>&1 || {
              tail -n 120 native-cli-output/three-level-native-reopen.log
              exit 1
            }
          mapfile -d '' stls < <(find native-cli-output/three-level-private-stl \
            -type f -iname '*.stl' -print0)
          if [ "${#stls[@]}" -lt 1 ] || [ "${#stls[@]}" -gt 2 ]; then
            echo "Unexpected native STL count after three-level COW: ${#stls[@]}"
            exit 1
          fi
          python3 scripts/audit_native_3mf_instance_placement.py \
            --input native-cli-output/three-level-private.3mf \
            --require-instances 2 --verify-stls "${stls[@]}" \
            --report native-cli-output/three-level-native-stl-audit.log
          echo "PASS: official native v2.5.0 reopened isolated three-level Core geometry"

      - name: Reopen three-level detached and Y-scaled Core mesh with official native v2.5.0
        shell: bash
        run: |
          set -euo pipefail
          # Separate, bounded proof: the preceding native CLI COW fixture has
          # root -> middle -> mesh. Edit ONLY the now-private selected leaf.
          python3 scripts/scale_native_3mf_private_leaf.py \
            --input native-cli-output/three-level-private.3mf \
            --output native-cli-output/three-level-scaled-y.3mf \
            --build-index 1 --component-edges 0,0 --scale-y 1.2 \
            --report native-cli-output/three-level-scaled-y-audit.log
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from audit_native_3mf_instance_placement import inspect_placements
          from compare_3mf_metadata import inventory
          from plan_native_3mf_copy_on_write import plan_copy_on_write
          before_path = "native-cli-output/three-level-private.3mf"
          after_path = "native-cli-output/three-level-scaled-y.3mf"
          before = inspect_placements(before_path)
          after = inspect_placements(after_path)
          if before["per_build_world_bounds_mm"][0] != after["per_build_world_bounds_mm"][0]:
              raise SystemExit("Three-level private Y edit altered original sibling")
          if before["per_build_world_bounds_mm"][1] == after["per_build_world_bounds_mm"][1]:
              raise SystemExit("Three-level private Y edit had no measurable effect")
          for old, new in zip(before["mesh_instances"], after["mesh_instances"]):
              for key in ("build_index", "mesh_part", "mesh_objectid",
                          "world_transform3mf", "triangle_count", "component_path"):
                  if old[key] != new[key]:
                      raise SystemExit("Three-level edit altered an occurrence transform or identity")
          old, new = inventory(before_path), inventory(after_path)
          # The official CLI chooses external part names itself. Never
          # assume "first.model": identify the exact edited leaf occurrence.
          selected_part = before["mesh_instances"][1]["mesh_part"]
          if set(old) != set(new) or {
              k for k in old if old[k] != new[k]
          } != {selected_part}:
              raise SystemExit("Three-level edit changed ZIP members other than the selected leaf")
          if plan_copy_on_write(after_path, 1, [0, 0])["copy_on_write_required"]:
              raise SystemExit("Three-level edited leaf is still shared")
          print("PASS: three-level Y edit changed only detached mesh and selected world bounds")
          PY
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          mkdir -p native-cli-output/three-level-scaled-y-stl
          timeout 180s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/three-level-scaled-y.3mf --arrange 0 --export-stl \
            --outputdir native-cli-output/three-level-scaled-y-stl \
            > native-cli-output/three-level-scaled-y-native-reopen.log 2>&1 || {
              tail -n 120 native-cli-output/three-level-scaled-y-native-reopen.log
              exit 1
            }
          mapfile -d '' stls < <(find native-cli-output/three-level-scaled-y-stl \
            -type f -iname '*.stl' -print0)
          if [ "${#stls[@]}" -lt 1 ] || [ "${#stls[@]}" -gt 2 ]; then
            echo "Unexpected native STL count for three-level private Y edit: ${#stls[@]}"
            exit 1
          fi
          python3 scripts/audit_native_3mf_instance_placement.py \
            --input native-cli-output/three-level-scaled-y.3mf \
            --require-instances 2 --verify-stls "${stls[@]}" \
            --report native-cli-output/three-level-scaled-y-native-stl-audit.log
          echo "PASS: official native v2.5.0 reopened Y-edited three-level Core geometry"

      - name: Archive text diagnostics without redistributing the AppImage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcaslicer-v250-official-native-cli-diagnostics
          path: |
            native-cli-output/*.log
            native-cli-output/*.sha256
            native-cli-output/appimage-format.txt
          if-no-files-found: warn
          retention-days: 7
