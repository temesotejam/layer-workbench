permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright controller
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Download only the previously verified candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: layer-workbench-orcaslicer-v2.5.0-wasm
          repository: temesotejam/layer-workbench
          run-id: 43144590877
          github-token: ${{ github.token }}
          path: engine-test-artifacts
      - name: Verify artifact files are present
        shell: bash
        run: |
          set -euo pipefail
          test -s engine-test-artifacts/slicer-mt.js
          test -s engine-test-artifacts/slicer-mt.wasm
          test "$(wc -c < engine-test-artifacts/slicer-mt.js)" -eq 150560
          test "$(wc -c < engine-test-artifacts/slicer-mt.wasm)" -eq 31294942
          node scripts/test-transform-matrix.mjs
          node scripts/test-multi-stl.mjs
          node scripts/test-obj-to-stl.mjs
          node --check scripts/obj-to-stl.mjs
          node scripts/test-process-profile-unit.mjs
          node scripts/test-slice-stl-process-application.mjs
          node scripts/test-hot-plate-bridge.mjs
          node scripts/test-process-preset-inheritance.mjs
          node scripts/test-orca-profile-collection.mjs
          node scripts/test-orca-vendor-index.mjs
          node scripts/test-gcode-preview-parser.mjs
          node scripts/test-gcode-feature-filter.mjs
          node scripts/test-gcode-speed-colors.mjs
          node scripts/test-gap-ring-fixture.mjs
          node scripts/test-audit-wasm-cube-deposition.mjs
          node scripts/test-audit-wasm-skirt-distance.mjs
          node scripts/test-bridge-arch-fixture.mjs
          node scripts/test-support-sphere-fixture.mjs
          node scripts/test-bridge-feature-diagnostic.mjs
          node scripts/test-support-feature-diagnostic.mjs
          node scripts/test-support-extrusion-diagnostic.mjs
          node scripts/test-vertical-shell-diagnostic.mjs
          node scripts/test-surface-skin-diagnostic.mjs
          node scripts/test-initial-layer-travel-diagnostic.mjs
          node scripts/test-3mf-viewport-items.mjs
          node scripts/test-preflight-3mf-zip.mjs
          node scripts/test-inspect-native-3mf.mjs
          node scripts/test-audit-native-3mf-relations.mjs
          node scripts/test-audit-native-3mf-anchor-spacing.mjs
          node scripts/test-audit-native-3mf-linear-parity.mjs
          node scripts/test-audit-native-3mf-frame-offsets.mjs
          node scripts/test-audit-native-3mf-shared-mesh-reframe.mjs
          node scripts/test-audit-native-3mf-world-facets.mjs
          node scripts/test-audit-native-3mf-stl-normals.mjs
          node --check scripts/three-mf-viewport-items.mjs
          node --check scripts/gcode-3d-preview.mjs
          node --check scripts/gcode-layer-preview.mjs
          node --check scripts/gcode-tool-colors.mjs
          node --check scripts/slice-stl.mjs
          node --check scripts/probe-engine.mjs
          node --check scripts/test-engine-probe.mjs
          node --check scripts/test-browser-3mf-roundtrip.mjs
          node --check scripts/test-browser-3mf-multiobject.mjs
          python3 -m unittest discover -s scripts -p test_check_3mf_stl_bounds.py -v
          python3 scripts/test_make_3mf_two_build_fixture.py -v
          python3 scripts/test_export_core_fixture_facets.py -v
      - name: Launch isolated local server and probe engine in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve-isolated.py --port 8766 > /tmp/isolated-layer-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:8766/engine-probe.html >/dev/null; then break; fi
            sleep 1
          done
          # Independent Core 3MF with two build placements; local diagnostic only.
          python3 scripts/make_3mf_two_build_fixture.py --output parity-output/two-build-items.3mf
          python3 scripts/audit_3mf_scene.py \
            --input parity-output/two-build-items.3mf \
            --expected-build-items 2 --min-triangles 12 \
            --report parity-output/two-build-items-scene.json
          # Rotated + nonuniformly scaled Core build item: real Chrome must
          # compare Three.js geometry/affines with the independent native WASM.
          python3 scripts/make_3mf_two_build_fixture.py \
            --output parity-output/two-build-rotated-scaled.3mf --rotated-scaled
          python3 scripts/audit_3mf_scene.py \
            --input parity-output/two-build-rotated-scaled.3mf \
            --expected-build-items 2 --min-triangles 12 \
            --report parity-output/two-build-rotated-scaled-scene.json
          # Different resource meshes and reversed build order: detect incorrect
          # objectid binding that matching two identical cube instances misses.
          python3 scripts/make_3mf_two_build_fixture.py \
            --output parity-output/two-build-distinct-reversed.3mf \
            --rotated-scaled --distinct-objects --reverse-build-order
          python3 scripts/audit_3mf_scene.py \
            --input parity-output/two-build-distinct-reversed.3mf \
            --expected-build-items 2 --min-triangles 12 \
            --report parity-output/two-build-distinct-reversed-scene.json
          # Three independent transforms on the same Core mesh exercise the
          # shared-local-origin hypothesis using the REAL pinned WASM candidate.
          # The two-build fixture alone is mathematically insufficient.
          python3 scripts/make_3mf_two_build_fixture.py \
            --output parity-output/three-build-shared-mesh.3mf \
            --rotated-scaled --third-shared-mesh
          python3 scripts/audit_3mf_scene.py \
            --input parity-output/three-build-shared-mesh.3mf \
            --expected-build-items 3 --min-triangles 12 \
            --report parity-output/three-build-shared-mesh-scene.json
          # Independent original Core triangle indices; local CI artifact only.
          python3 scripts/export_core_fixture_facets.py \
            --input parity-output/three-build-shared-mesh.3mf \
            --output parity-output/three-build-source-facets.json
          # Controlled positive-volume Core face order: identical vertices,
          # build references and transforms; ONLY v2/v3 are swapped.
          # Keep the synthetic archive and source coordinates local to CI.
          python3 scripts/make_3mf_two_build_fixture.py \
            --output parity-output/three-build-positive-winding.3mf \
            --rotated-scaled --third-shared-mesh --positive-winding
          python3 scripts/audit_3mf_scene.py \
            --input parity-output/three-build-positive-winding.3mf \
            --expected-build-items 3 --min-triangles 12 \
            --report parity-output/three-build-positive-winding-scene.json
          python3 scripts/export_core_fixture_facets.py \
            --input parity-output/three-build-positive-winding.3mf \
            --output parity-output/three-build-positive-source-facets.json
          node scripts/test-engine-probe.mjs
          # Compare actual 3MF bytes exported and re-imported by the browser
          # engine. This is not a desktop 3MF parity result.
          python3 scripts/compare_3mf_metadata.py \
            --baseline parity-output/wasm-native-3mf.3mf \
            --candidate parity-output/wasm-native-3mf-preserved.3mf \
            --scope all --report parity-output/browser-3mf-preservation.json
          # Inspect actual WASM-created core 3MF scene, including nonempty
          # mesh triangles, build item count and raw instance transforms.
          # This is a diagnostic check, not proof of desktop 3MF compatibility.
          python3 scripts/audit_3mf_scene.py \
            --input parity-output/wasm-native-3mf.3mf \
            --expected-build-items 1 --min-triangles 12 \
            --report parity-output/browser-3mf-scene.json
          python3 scripts/check_3mf_stl_bounds.py \
            --input parity-output/wasm-native-3mf.3mf \
            --stl parity-output/wasm-3mf-converted.stl \
            --report parity-output/browser-3mf-stl-bounds.json
          # Two input objects retain both 12-triangle geometric clusters but
          # current 3MF exporter flattens hierarchy into one build item.
          # This is a diagnostic only, NOT an object-preservation parity PASS.
          python3 scripts/audit_3mf_scene.py \
            --input parity-output/wasm-multiobject-3mf.3mf \
            --min-triangles 24 \
            --report parity-output/browser-multiobject-3mf-scene.json
          python3 scripts/check_3mf_stl_bounds.py \
            --input parity-output/wasm-multiobject-3mf.3mf \
            --stl parity-output/wasm-multiobject-converted.stl \
            --report parity-output/browser-multiobject-3mf-stl-comparison.json
      - name: Archive actual WASM G-code diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-workbench-wasm-gcode-diagnostic
          path: parity-output/
          if-no-files-found: warn
          retention-days: 14
