name: Verify v2.5.0 WASM candidate in isolated Chrome

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engine-probe.html"
      - "scripts/probe-engine.mjs"
      - "scripts/slice-stl.mjs"
      - "scripts/test-process-profile.mjs"
      - "scripts/test-process-profile-unit.mjs"
      - "scripts/process-preset-inheritance.mjs"
      - "scripts/orca-profile-collection.mjs"
      - "scripts/orca-vendor-index.mjs"
      - "scripts/test-orca-vendor-index.mjs"
      - "scripts/test-orca-profile-collection.mjs"
      - "scripts/test-process-preset-inheritance.mjs"
      - "scripts/gcode-preview-parser.mjs"
      - "scripts/gcode-layer-preview.mjs"
      - "scripts/gcode-3d-preview.mjs"
      - "scripts/gcode-tool-colors.mjs"
      - "scripts/test-gcode-preview-parser.mjs"
      - "scripts/multi-stl.mjs"
      - "scripts/test-multi-stl.mjs"
      - "scripts/transform-matrix.mjs"
      - "scripts/test-transform-matrix.mjs"
      - "scripts/prepare-engine-lab.mjs"
      - "app.js"
      - "index.html"
      - "scripts/serve-isolated.py"
      - "scripts/test-engine-probe.mjs"
      - "scripts/test-browser-3mf-roundtrip.mjs"
      - "scripts/test-browser-3mf-multiobject.mjs"
      - "scripts/three_mf_instance_expansion.py"
      - "scripts/audit_3mf_scene.py"
      - "scripts/check_3mf_stl_bounds.py"
      - "scripts/test_check_3mf_stl_bounds.py"
      - "scripts/compare_3mf_metadata.py"
      - ".github/workflows/verify-engine-browser.yml"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright controller
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Download only the previously verified candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: layer-workbench-orcaslicer-v2.5.0-wasm
          repository: temesotejam/layer-workbench
          run-id: 43144590877
          github-token: ${{ github.token }}
          path: engine-test-artifacts
      - name: Verify artifact files are present
        shell: bash
        run: |
          set -euo pipefail
          test -s engine-test-artifacts/slicer-mt.js
          test -s engine-test-artifacts/slicer-mt.wasm
          test "$(wc -c < engine-test-artifacts/slicer-mt.js)" -eq 150560
          test "$(wc -c < engine-test-artifacts/slicer-mt.wasm)" -eq 31294942
          node scripts/test-transform-matrix.mjs
          node scripts/test-multi-stl.mjs
          node scripts/test-process-profile-unit.mjs
          node scripts/test-process-preset-inheritance.mjs
          node scripts/test-orca-profile-collection.mjs
          node scripts/test-orca-vendor-index.mjs
          node scripts/test-gcode-preview-parser.mjs
          node --check scripts/gcode-3d-preview.mjs
          node --check scripts/gcode-layer-preview.mjs
          node --check scripts/gcode-tool-colors.mjs
          node --check scripts/slice-stl.mjs
          node --check scripts/probe-engine.mjs
          node --check scripts/test-engine-probe.mjs
          node --check scripts/test-browser-3mf-roundtrip.mjs
          node --check scripts/test-browser-3mf-multiobject.mjs
          python3 -m unittest discover -s scripts -p test_check_3mf_stl_bounds.py -v
      - name: Launch isolated local server and probe engine in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve-isolated.py --port 8766 > /tmp/isolated-layer-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:8766/engine-probe.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-engine-probe.mjs
          # Compare actual 3MF bytes exported and re-imported by the browser
          # engine. This is not a desktop 3MF parity result.
          python3 scripts/compare_3mf_metadata.py \
            --baseline parity-output/wasm-native-3mf.3mf \
            --candidate parity-output/wasm-native-3mf-preserved.3mf \
            --scope all --report parity-output/browser-3mf-preservation.json
          # Inspect actual WASM-created core 3MF scene, including nonempty
          # mesh triangles, build item count and raw instance transforms.
          # This is a diagnostic check, not proof of desktop 3MF compatibility.
          python3 scripts/audit_3mf_scene.py \
            --input parity-output/wasm-native-3mf.3mf \
            --expected-build-items 1 --min-triangles 12 \
            --report parity-output/browser-3mf-scene.json
          python3 scripts/check_3mf_stl_bounds.py \
            --input parity-output/wasm-native-3mf.3mf \
            --stl parity-output/wasm-3mf-converted.stl \
            --report parity-output/browser-3mf-stl-bounds.json
          # Two input objects retain both 12-triangle geometric clusters but
          # current 3MF exporter flattens hierarchy into one build item.
          # This is a diagnostic only, NOT an object-preservation parity PASS.
          python3 scripts/audit_3mf_scene.py \
            --input parity-output/wasm-multiobject-3mf.3mf \
            --min-triangles 24 \
            --report parity-output/browser-multiobject-3mf-scene.json
          python3 scripts/check_3mf_stl_bounds.py \
            --input parity-output/wasm-multiobject-3mf.3mf \
            --stl parity-output/wasm-multiobject-converted.stl \
            --report parity-output/browser-multiobject-3mf-stl-comparison.json
      - name: Archive actual WASM G-code diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-workbench-wasm-gcode-diagnostic
          path: parity-output/
          if-no-files-found: warn
          retention-days: 14
