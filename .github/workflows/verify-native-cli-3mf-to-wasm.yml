name: Verify official native CLI 3MF in isolated WASM Chrome
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/edit_native_3mf_build_transform.py"
      - "scripts/verify_native_3mf_edit_effect.py"
      - "scripts/test_edit_native_3mf_build_transform.py"
      - "scripts/test_verify_native_3mf_edit_effect.py"
      - "scripts/audit-native-3mf-world-facets.mjs"
      - "scripts/test-audit-native-3mf-world-facets.mjs"
      - "scripts/verify_native_exported_stl.py"
      - "scripts/compare_native_3mf_world_facets.py"
      - "scripts/compare_3mf_metadata.py"
      - "scripts/audit_native_3mf_metadata_loss.py"
      - "scripts/test_audit_native_3mf_metadata_loss.py"
      - "scripts/compare_gcode.py"
      - "scripts/audit_gcode_infill_config.py"
      - "scripts/test_audit_gcode_infill_config.py"
      - "scripts/gcode_lexical_attribution.py"
      - "scripts/test_gcode_lexical_attribution.py"
      - "scripts/verify_native_gcode_repeatability.py"
      - "scripts/test_verify_native_gcode_repeatability.py"
      - "scripts/preserve-native-source-translation.mjs"
      - "scripts/preflight-3mf-zip.mjs"
      - "scripts/test-native-cli-3mf-to-wasm.mjs"
      - ".github/workflows/verify-native-cli-3mf-to-wasm.yml"
  push:
    branches: [main]
    paths:
      - "scripts/edit_native_3mf_build_transform.py"
      - "scripts/verify_native_3mf_edit_effect.py"
      - "scripts/test_edit_native_3mf_build_transform.py"
      - "scripts/test_verify_native_3mf_edit_effect.py"
      - "scripts/audit-native-3mf-world-facets.mjs"
      - "scripts/test-audit-native-3mf-world-facets.mjs"
      - "scripts/verify_native_exported_stl.py"
      - "scripts/compare_native_3mf_world_facets.py"
      - "scripts/compare_3mf_metadata.py"
      - "scripts/audit_native_3mf_metadata_loss.py"
      - "scripts/test_audit_native_3mf_metadata_loss.py"
      - "scripts/compare_gcode.py"
      - "scripts/audit_gcode_infill_config.py"
      - "scripts/test_audit_gcode_infill_config.py"
      - "scripts/gcode_lexical_attribution.py"
      - "scripts/test_gcode_lexical_attribution.py"
      - "scripts/verify_native_gcode_repeatability.py"
      - "scripts/test_verify_native_gcode_repeatability.py"
      - "scripts/preserve-native-source-translation.mjs"
      - "scripts/preflight-3mf-zip.mjs"
      - "scripts/test-native-cli-3mf-to-wasm.mjs"
      - ".github/workflows/verify-native-cli-3mf-to-wasm.yml"
permissions:
  contents: read
  actions: read
jobs:
  native-project-browser:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser test and matching regressions
        run: |
          node --check scripts/test-native-cli-3mf-to-wasm.mjs
          node --check scripts/preserve-native-source-translation.mjs
          node scripts/test-audit-native-3mf-world-facets.mjs
          python3 -m unittest discover -s scripts -p test_edit_native_3mf_build_transform.py -v
          python3 -m unittest discover -s scripts -p test_verify_native_3mf_edit_effect.py -v
          python3 -m unittest discover -s scripts -p test_compare_native_3mf_world_facets.py -v
          python3 -m unittest discover -s scripts -p test_audit_native_3mf_metadata_loss.py -v
          python3 -m unittest discover -s scripts -p test_verify_native_gcode_repeatability.py -v
          python3 -m unittest discover -s scripts -p test_gcode_lexical_attribution.py -v
          python3 -m unittest discover -s scripts -p test_audit_gcode_infill_config.py -v
          npm install --no-save --no-package-lock playwright@1.56.1 fflate@0.8.2
      - name: Download the official v2.5.0 Linux AppImage only inside CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-cli-output
          asset="OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          url="https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.5.0/${asset}"
          curl --fail --location --show-error --silent --retry 3 \
            --retry-all-errors --max-time 360 --max-filesize 800000000 \
            "${url}" -o "${RUNNER_TEMP}/${asset}"
          test "$(wc -c < "${RUNNER_TEMP}/${asset}")" -gt 50000000
          file "${RUNNER_TEMP}/${asset}" | tee native-cli-output/appimage-format.txt
          grep -q 'ELF' native-cli-output/appimage-format.txt
          sha256sum "${RUNNER_TEMP}/${asset}" | tee native-cli-output/official-v250-appimage.sha256
          # Observed on the official release asset in two independent PR CI downloads.
          actual="$(sha256sum "${RUNNER_TEMP}/${asset}" | cut -d ' ' -f1)"
          test "${actual}" = "d13eb0a9cd618ed080ab6b82c64c0a60c4501aac91e88d5ac2c3b526fb141a7c"
          chmod +x "${RUNNER_TEMP}/${asset}"
      - name: Install the host libraries required by the official AppImage
        shell: bash
        run: |
          set -euo pipefail
          # Hosted runners sometimes select a very slow regional EC2
          # Ubuntu mirror; the last two PR probes reached the job timeout
          # while downloading ordinary dependencies. Change only that mirror
          # on this ephemeral runner, retaining Ubuntu's signed repositories
          # and its separate security source.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "${source}" ] && grep -Eq '([a-z0-9-]+\.)?ec2\.archive\.ubuntu\.com' "${source}"; then
              sudo sed -i -E 's@https?://[a-z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu@http://archive.ubuntu.com/ubuntu@g' "${source}"
              echo "Switched regional EC2 archive mirror to standard Ubuntu archive in ${source}"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            libopengl0 libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 libglu1-mesa
      - name: Prepare pinned full native v2.5.0 machine, process and filament presets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-prepare-native-v250-presets.mjs
          # Upstream JSON stays ephemeral on the runner. Source revision is
          # pinned in the fetcher and asserted again during materialization.
          python3 scripts/fetch-upstream-v250-fixture.py
          node scripts/prepare-native-v250-presets.mjs \
            upstream-v250-creality-fixture.json upstream-v250-filament-fixture.json \
            native-cli-output/native-profiles
          # Preserve only the provenance and digest manifest in CI artifacts.
          cp native-cli-output/native-profiles/manifest.json native-cli-output/native-profiles-manifest.log

      - name: Generate official native multipart project in CI
        shell: bash
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          python3 scripts/make_3mf_two_build_fixture.py --output native-cli-output/two-build-items.3mf
          project="${PWD}/native-cli-output/native-v250-project.3mf"
          timeout 180s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            native-cli-output/two-build-items.3mf \
            --load-settings "native-cli-output/native-profiles/process.json;native-cli-output/native-profiles/machine.json" \
            --load-filaments native-cli-output/native-profiles/filament.json \
            --arrange 0 --export-3mf "${project}" \
            > native-cli-output/native-project-export.log 2>&1 || {
              tail -n 120 native-cli-output/native-project-export.log
              exit 1
            }
          test -s "${project}"
          python3 scripts/verify_native_3mf_package.py --input "${project}"
          # Independently compose Core build and external-component transforms.
          # Keep the original oriented facets private to this disposable runner.
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from compare_native_3mf_world_facets import _world_facets
          rows = _world_facets('native-cli-output/native-v250-project.3mf')
          if [row['triangle_count'] for row in rows] != [12, 12]:
              raise SystemExit('Unexpected native fixture facet counts')
          Path('native-cli-output/native-world-facets.json').write_text(
              json.dumps([row['oriented_facets'] for row in rows]))
          PY
      - name: Translate one native build item offline and audit non-target bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/edit_native_3mf_build_transform.py \
            --input native-cli-output/native-v250-project.3mf \
            --output native-cli-output/native-v250-project-translated.3mf \
            --build-index 0 --translate-mm 12 -7 0
          python3 scripts/verify_native_3mf_edit_effect.py \
            --baseline native-cli-output/native-v250-project.3mf \
            --candidate native-cli-output/native-v250-project-translated.3mf \
            --build-index 0 --translate-mm 12 -7 0
      - name: Fetch accepted WASM candidate (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: layer-workbench-orcaslicer-v2.5.0-wasm
          repository: temesotejam/layer-workbench
          run-id: 45284215349
          github-token: ${{ github.token }}
          path: engine-test-artifacts
      - name: Native CLI project to isolated Chrome WASM
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve-isolated.py --port 8766 > /tmp/isolated-layer-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:8766/engine-probe.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-native-cli-3mf-to-wasm.mjs
          node scripts/test-native-cli-3mf-to-wasm.mjs --translated
          node scripts/test-native-cli-3mf-to-wasm.mjs --private-edit

      - name: Quantify native config and package loss without printing settings
        shell: bash
        run: |
          set -euo pipefail
          # Positive control: the independent offline translation preserved
          # metadata member bytes. Do not lower this gate for WASM.
          python3 scripts/audit_native_3mf_metadata_loss.py \
            --baseline native-cli-output/native-v250-project.3mf \
            --candidate native-cli-output/native-v250-project-translated.3mf \
            --require-identical-config
          # Best effort intentionally allows metadata loss. Report counts
          # even when the candidate has no native config members. Geometry
          # acceptance and strict preservation rejection remain separate.
          python3 scripts/audit_native_3mf_metadata_loss.py \
            --baseline native-cli-output/native-v250-project.3mf \
            --candidate native-cli-output/wasm-private-edited.3mf

      - name: Require source-preserving browser edit to keep every non-target member
        shell: bash
        run: |
          set -euo pipefail
          # Select the left-hand original build independently from Core facets.
          index="$(python3 - <<'PY'
          import json
          from pathlib import Path
          groups=json.loads(Path('native-cli-output/native-world-facets.json').read_text())
          assert len(groups)==2
          bounds=[(min(p[0] for f in g for p in f),max(p[0] for f in g for p in f)) for g in groups]
          index=min(range(2),key=lambda i:bounds[i][0])
          assert bounds[index][1]+12<bounds[1-index][0]
          print(index)
          PY
          )"
          python3 scripts/verify_native_3mf_edit_effect.py \
            --baseline native-cli-output/native-v250-project.3mf \
            --candidate native-cli-output/browser-source-preserving-edited.3mf \
            --build-index "${index}" --translate-mm 12 -7 0
          python3 scripts/audit_native_3mf_metadata_loss.py \
            --baseline native-cli-output/native-v250-project.3mf \
            --candidate native-cli-output/browser-source-preserving-edited.3mf \
            --require-identical-config

      - name: Reopen both browser-edited 3MF variants in official native v2.5.0 CLI
        shell: bash
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          for variant in wasm-private-edited browser-source-preserving-edited; do
          export REOPEN_VARIANT="${variant}"
          edited="native-cli-output/${variant}.3mf"
          test -s "${edited}"
          sha256sum "${edited}"
          mkdir "native-cli-output/${variant}-native-stl"
          # Do not inject replacement profiles: this is a geometry import
          # test of both actual browser-produced archives, not metadata parity.
          timeout 120s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            "${edited}" --arrange 0 --export-stl \
            --outputdir "native-cli-output/${variant}-native-stl" \
            > "native-cli-output/${variant}-native-reopen.log" 2>&1 || {
              tail -n 100 "native-cli-output/${variant}-native-reopen.log"
              exit 1
            }
          # The existing independent STL reader accepts ASCII or binary.
          # Normalize only the STL container to binary for the facet oracle.
          python3 - <<'PY'
          import math
          import os
          import struct
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from verify_native_exported_stl import read_triangles
          root = Path('native-cli-output')
          variant = os.environ['REOPEN_VARIANT']
          paths = sorted(p for p in (root / (variant + '-native-stl')).rglob('*')
                         if p.is_file() and p.suffix.lower() == '.stl')
          if not 1 <= len(paths) <= 2:
              raise SystemExit('Expected one combined or two individual native STLs')
          faces = [face for path in paths for face in read_triangles(path)]
          if len(faces) != 24:
              raise SystemExit('Expected exactly 24 native-exported facets')
          data = bytearray(80) + struct.pack('<I', len(faces))
          for face in faces:
              if len(face) != 3 or any(len(p) != 3 or any(not math.isfinite(v) or
                     abs(v) > 1e7 for v in p) for p in face):
                  raise SystemExit('Invalid native STL vertex')
              # Normals are intentionally ignored; vertex order is unchanged.
              data.extend(struct.pack('<12fH', 0, 0, 0,
                                      *(v for p in face for v in p), 0))
          (root / (variant + '-native-world.stl')).write_bytes(data)
          PY
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {auditNative3mfWorldFacetGroups,auditNative3mfWorldFacetWinding}
            from './scripts/audit-native-3mf-world-facets.mjs';
          const root='native-cli-output/';
          // Oracle comes only from the original official 3MF Core XML,
          // not from the WASM-edited archive or its reimported STL.
          const groups=JSON.parse(await readFile(root+'native-world-facets.json','utf8'));
          assert.deepEqual(groups.map(g=>g.length),[12,12]);
          const minX=g=>Math.min(...g.flat().map(v=>v[0]));
          const maxX=g=>Math.max(...g.flat().map(v=>v[0]));
          groups.sort((a,b)=>minX(a)-minX(b));
          assert.ok(maxX(groups[0])+12<minX(groups[1]));
          const expected=groups.map((g,i)=>g.map(f=>f.map(([x,y,z])=>
            i===0?[x+12,y-7,z]:[x,y,z])));
          const variant=process.env.REOPEN_VARIANT;
          assert.ok(['wasm-private-edited','browser-source-preserving-edited'].includes(variant));
          const stl=await readFile(root+variant+'-native-world.stl');
          const geometry=auditNative3mfWorldFacetGroups(stl,expected,0.05);
          const winding=auditNative3mfWorldFacetWinding(stl,expected.flat(),0.05);
          console.log('WASM_EDIT_TO_NATIVE_CLI '+JSON.stringify({variant,geometry,winding,
            toleranceMm:0.05,metadataParity:false,printSafety:false}));
          assert.deepEqual(geometry,{partition:'separable',comparedBuilds:2,comparedTriangles:24});
          assert.deepEqual(winding,{winding:'consistent',comparedTriangles:24});
          console.log('PASS: official native CLI reopened '+variant+' with expected oriented geometry');
          JS
          done
          # No 3MF, STL, official presets or G-code are uploaded.

      - name: Compare native re-exported project settings against independent offline edit
        shell: bash
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          # Same native serializer, same translation, no replacement settings.
          # Compare the independently edited control to the actual browser edit
          # to separate native normalization from browser-specific changes.
          for variant in native-v250-project-translated browser-source-preserving-edited; do
            input="${PWD}/native-cli-output/${variant}.3mf"
            output="${PWD}/native-cli-output/${variant}-native-reexport.3mf"
            test -s "${input}"
            timeout 120s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
              "${input}" --arrange 0 --export-3mf "${output}" \
              > "native-cli-output/${variant}-native-reexport.log" 2>&1 || {
                echo "Native project re-export failed for ${variant}"
                exit 1
              }
            test -s "${output}"
            python3 scripts/verify_native_3mf_package.py --input "${output}"
          done
          # Report normalization relative to the original settings, without
          # requiring the native serializer to preserve its original bytes.
          python3 scripts/audit_native_3mf_metadata_loss.py \
            --baseline native-cli-output/native-v250-project-translated.3mf \
            --candidate native-cli-output/native-v250-project-translated-native-reexport.3mf
          # A strict typed comparison must not accept missing/empty settings.
          python3 scripts/audit_native_3mf_metadata_loss.py \
            --baseline native-cli-output/native-v250-project-translated-native-reexport.3mf \
            --candidate native-cli-output/browser-source-preserving-edited-native-reexport.3mf \
            --require-identical-project-json
          echo "PASS: native re-exported project JSON matches independently translated control"
          # This tests serialized settings, not effective slicing or complete
          # object metadata semantics. Keep all files on the disposable runner.


      - name: Compare native re-exported object and part settings XML
        shell: bash
        run: |
          set -euo pipefail
          # First log all scope counts (including plate and runtime instance
          # identity); then fail closed if the object or part nodes differ.
          python3 scripts/audit_native_3mf_metadata_loss.py \
            --baseline native-cli-output/native-v250-project-translated-native-reexport.3mf \
            --candidate native-cli-output/browser-source-preserving-edited-native-reexport.3mf \
            --compare-model-xml
          python3 scripts/audit_native_3mf_metadata_loss.py \
            --baseline native-cli-output/native-v250-project-translated-native-reexport.3mf \
            --candidate native-cli-output/browser-source-preserving-edited-native-reexport.3mf \
            --require-identical-object-part-xml
          echo "PASS: native re-exported object and part XML matches independent translated control"
          # This is a bounded ordered XML comparison, not full metadata
          # semantics. Plate/instance/assembly scopes are diagnostic only.

      - name: Compare actual native slices of both re-exported projects
        shell: bash
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          # Use the embedded project settings only. Injecting replacement
          # profiles would hide a round-trip setting or import discrepancy.
          # Slice the independent control twice to distinguish reproducibility
          # failures from browser-specific differences.
          for variant in control control-repeat browser; do
            case "${variant}" in
              control|control-repeat) input=native-v250-project-translated-native-reexport ;;
              browser) input=browser-source-preserving-edited-native-reexport ;;
            esac
            out="${PWD}/native-cli-output/roundtrip-slice-${variant}"
            mkdir "${out}"
            timeout 180s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
              "${PWD}/native-cli-output/${input}.3mf" \
              --arrange 0 --slice 0 --outputdir "${out}" \
              > "${out}/native-slice.log" 2>&1 || {
                echo "Native round-trip slice failed: ${variant}"
                exit 1
              }
            test -s "${out}/plate_1.gcode"
          done
          # Reuse the tested strict ordered-command comparator and require
          # nontrivial XY deposition. Do not log raw commands, settings,
          # mismatch excerpts, or upload the generated G-code.
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from verify_native_gcode_repeatability import audit
          root = Path('native-cli-output')
          def output(variant):
              folder = root / ('roundtrip-slice-' + variant)
              files = sorted(folder.rglob('*.gcode'))
              if files != [folder / 'plate_1.gcode']:
                  raise SystemExit('Expected exactly one native plate G-code')
              return files[0]
          failed = False
          for label, variant in [('native-control-repeat', 'control-repeat'),
                                 ('native-browser-roundtrip', 'browser')]:
              r = audit(output('control'), output(variant), minimum_extrusion=100)
              fields = ('pass', 'ordered_command_sha256_equal', 'raw_sha256_equal',
                        'first_command_count', 'repeat_command_count',
                        'first_positive_xy_extrusion_moves',
                        'repeat_positive_xy_extrusion_moves',
                        'ordered_command_mismatches', 'minimum_extrusion_moves')
              summary = {key: r[key] for key in fields}
              summary.update(comparison=label, input_issue_count=len(r['input_issues']),
                             native_vs_wasm_compared=False, usable_for_printing=False)
              print('NATIVE_3MF_ROUNDTRIP_SLICE ' + json.dumps(summary, sort_keys=True))
              failed |= not r['pass']
          if failed:
              raise SystemExit('Native command repeatability or round-trip comparison failed')
          print('PASS: official native slices match ordered commands for the tested 3MF round-trip')
          PY
          # This is native-vs-native after a browser edit, NOT native-vs-WASM
          # slicing parity. The original project and all G-code stay in CI.

      - name: Slice exactly the same browser-edited native project with both engines
        shell: bash
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage"
          input="${PWD}/native-cli-output/browser-source-preserving-edited.3mf"
          test -s "${input}"
          sha256sum "${input}"
          out="${PWD}/native-cli-output/same-archive-native"
          mkdir "${out}"
          timeout 180s env APPIMAGE_EXTRACT_AND_RUN=1 "${app}" \
            "${input}" --arrange 0 --slice 0 --outputdir "${out}" \
            > "${out}/native-slice.log" 2>&1 || {
              echo 'Native same-archive slice failed'
              exit 1
            }
          test -s "${out}/plate_1.gcode"
          python3 scripts/serve-isolated.py --port 8766 > /tmp/isolated-layer-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:8766/engine-probe.html >/dev/null; then break; fi
            sleep 1
          done
          timeout 240s node scripts/test-native-cli-3mf-to-wasm.mjs --slice-embedded
          # Strict comparator unchanged; no raw G-code or settings in the log.
          # A mismatch is a parity FAIL, not evidence that the harness failed.
          # Do not merge a failed gate or activate the engine on Pages.
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from compare_gcode import compare
          from gcode_lexical_attribution import compare_lexical
          from audit_gcode_infill_config import compare_infill_config
          root = Path('native-cli-output')
          folder = root / 'same-archive-native'
          native = folder / 'plate_1.gcode'
          wasm = root / 'same-archive-wasm.gcode'
          if sorted(folder.rglob('*.gcode')) != [native]:
              raise SystemExit('Expected exactly one native plate G-code')
          if not all(1024 <= p.stat().st_size <= 12_000_000 for p in (native, wasm)):
              raise SystemExit('Same-archive G-code outside diagnostic bounds')
          r = compare(native, wasm, min_extrusion_moves=100)
          fields = ('match', 'mismatched_commands', 'native_commands', 'wasm_commands',
                    'native_extrusion_moves', 'wasm_extrusion_moves',
                    'native_counted_linear_xy_mm', 'wasm_counted_linear_xy_mm',
                    'native_counted_planar_z_levels', 'wasm_counted_planar_z_levels',
