name: Verify 3MF archive preservation audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/compare_3mf_metadata.py"
      - "scripts/compare_3mf_build_preservation.py"
      - "scripts/test_compare_3mf_build_preservation.py"
      - "scripts/test_compare_3mf_metadata.py"
      - "scripts/three_mf_instance_expansion.py"
      - "scripts/clone_native_3mf_branched_root.py"
      - "scripts/test_clone_native_3mf_branched_root.py"
      - "scripts/audit_native_3mf_metadata_object_refs.py"
      - "scripts/test_audit_native_3mf_metadata_object_refs.py"
      - "scripts/audit_native_3mf_part_mesh_context.py"
      - "scripts/test_audit_native_3mf_part_mesh_context.py"
      - "scripts/compare_native_3mf_part_mesh_candidates.py"
      - "scripts/test_compare_native_3mf_part_mesh_candidates.py"
      - "scripts/reconcile_native_3mf_cloned_root_settings.py"
      - "scripts/test_reconcile_native_3mf_cloned_root_settings.py"
      - "scripts/audit_native_3mf_part_value_roundtrip.py"
      - "scripts/test_audit_native_3mf_part_value_roundtrip.py"
      - "scripts/test_three_mf_instance_expansion.py"
      - "scripts/audit_3mf_scene.py"
      - "scripts/test_audit_3mf_scene.py"
      - "scripts/check_3mf_stl_bounds.py"
      - "scripts/edit_3mf_build_transform.py"
      - "scripts/test_edit_3mf_build_transform.py"
      - "scripts/patch_orcawasm_private_instance_edit.py"
      - "scripts/test_patch_orcawasm_private_instance_edit.py"
      - "scripts/patch-orcawasm-support-smoke.py"
      - "scripts/test_patch_orcawasm_support_smoke.py"
      - "scripts/make_3mf_two_build_fixture.py"
      - "scripts/test_check_3mf_stl_bounds.py"
      - ".github/workflows/test-3mf-parity.yml"

  pull_request:
    paths:
      - "scripts/compare_3mf_build_preservation.py"
      - "scripts/test_compare_3mf_build_preservation.py"
      - "scripts/edit_3mf_build_transform.py"
      - "scripts/test_edit_3mf_build_transform.py"
      - "docs/V250_3MF_CORE_MODEL_PRESERVATION.md"
      - "scripts/clone_native_3mf_branched_root.py"
      - "scripts/test_clone_native_3mf_branched_root.py"
      - "scripts/audit_native_3mf_metadata_object_refs.py"
      - "scripts/test_audit_native_3mf_metadata_object_refs.py"
      - "scripts/audit_native_3mf_part_mesh_context.py"
      - "scripts/test_audit_native_3mf_part_mesh_context.py"
      - "scripts/compare_native_3mf_part_mesh_candidates.py"
      - "scripts/test_compare_native_3mf_part_mesh_candidates.py"
      - "scripts/reconcile_native_3mf_cloned_root_settings.py"
      - "scripts/test_reconcile_native_3mf_cloned_root_settings.py"
      - "scripts/audit_native_3mf_part_value_roundtrip.py"
      - "scripts/test_audit_native_3mf_part_value_roundtrip.py"
      - "scripts/compare_3mf_metadata.py"
      - "scripts/test_compare_3mf_metadata.py"
      - "docs/V250_3MF_ANCILLARY_PRESERVATION.md"
      - "scripts/patch_orcawasm_private_instance_edit.py"
      - "scripts/test_patch_orcawasm_private_instance_edit.py"
      - "scripts/patch-orcawasm-support-smoke.py"
      - "scripts/test_patch_orcawasm_support_smoke.py"
      - ".github/workflows/test-3mf-parity.yml"

permissions:
  contents: read

jobs:
  archive-preservation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check 3MF comparator syntax and unit tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/compare_3mf_metadata.py
          python3 -m unittest discover -s scripts -p test_compare_3mf_metadata.py -v
          python3 -m py_compile scripts/compare_3mf_build_preservation.py
          python3 -m unittest discover -s scripts -p test_compare_3mf_build_preservation.py -v
          python3 -m unittest discover -s scripts -p test_audit_3mf_scene.py -v
          python3 -m unittest discover -s scripts -p test_three_mf_instance_expansion.py -v
          python3 -m unittest discover -s scripts -p test_check_3mf_stl_bounds.py -v
          python3 -m py_compile scripts/edit_3mf_build_transform.py
          python3 -m unittest discover -s scripts -p test_edit_3mf_build_transform.py -v
          python3 -m py_compile scripts/patch_orcawasm_private_instance_edit.py
          python3 -m unittest discover -s scripts -p test_patch_orcawasm_private_instance_edit.py -v
          python3 -m py_compile scripts/patch-orcawasm-support-smoke.py
          python3 -m unittest discover -s scripts -p test_patch_orcawasm_support_smoke.py -v
          python3 -m unittest discover -s scripts -p test_clone_native_3mf_branched_root.py -v
          python3 -m py_compile scripts/audit_native_3mf_metadata_object_refs.py
          python3 -m unittest discover -s scripts -p test_audit_native_3mf_metadata_object_refs.py -v
          python3 -m unittest discover -s scripts -p test_audit_native_3mf_part_mesh_context.py -v
          python3 -m unittest discover -s scripts -p test_compare_native_3mf_part_mesh_candidates.py -v
          python3 -m py_compile scripts/reconcile_native_3mf_cloned_root_settings.py
          python3 -m unittest discover -s scripts -p test_reconcile_native_3mf_cloned_root_settings.py -v
          python3 -m py_compile scripts/audit_native_3mf_part_value_roundtrip.py
          python3 -m unittest discover -s scripts -p test_audit_native_3mf_part_value_roundtrip.py -v
